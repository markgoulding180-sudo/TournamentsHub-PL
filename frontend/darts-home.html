<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Grand Prix - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root{
      --bg:#060b1e; --bg-panel:#0a1226; --bg-card:#0d1730;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth; overflow-x:hidden;}
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .bg-glow{ position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%); pointer-events:none; z-index:0; }

    /* ================= NAVBAR (matches every other page exactly) ================= */
    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-left{display:flex;align-items:center;gap:40px;}
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .nav-links{display:flex; gap:30px;}
    .nav-links a{ font-family:var(--font-head); font-size:14px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); padding-bottom:19px; position:relative; transition:color .2s; }
    .nav-links a:hover{color:var(--text);}
    .nav-links a.active{color:var(--text);}
    .nav-links a.active::after{ content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--accent-2); box-shadow:0 0 10px var(--accent-glow); border-radius:2px; }
    .nav-right{display:flex;align-items:center;gap:14px;}
    .icon-btn{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--bg-card); border:1px solid var(--border); }
    /* Matches the hub's SVG icon styling exactly - stroke-based line
       icons, not filled shapes, so they render identically everywhere. */
    .icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;color:var(--text-dim);}
    .icon-btn i{font-size:15px;color:var(--text-dim);}
    .avatar-btn{display:flex;align-items:center;gap:6px; padding:4px; border-radius:22px; border:1px solid transparent; transition:border-color .2s;}
    .avatar-btn:hover{border-color:var(--border);}
    .avatar{ width:36px;height:36px;border-radius:50%; background:linear-gradient(150deg,#2c3d5c,#161f33); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; }

    main{ position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:32px 24px 60px; }
    /* Background image behind the rounds/bracket area specifically, not
       the whole page - a dark gradient layers over it so the round
       cards and match rows (which already have their own solid
       backgrounds) stay fully readable regardless of the image itself,
       with the artwork showing through in the gaps between them. */
    #root{
      position:relative;
      background-image: linear-gradient(rgba(4,8,18,0.88), rgba(4,8,18,0.92)), url('assets/dartsbackground2.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      border-radius: 16px;
      padding: 20px;
    }

    /* ================= HERO (matches every other page's hero, real darts image) ================= */
    .hero{
      position:relative; border-radius:20px;
      background:
        linear-gradient(90deg, rgba(6,12,26,1) 0%, rgba(6,12,26,1) 30%, rgba(6,12,26,0.585) 55%, rgba(6,12,26,0.195) 100%),
        url('assets/card-darts.jpg');
      background-size: cover, cover;
      background-repeat: no-repeat, no-repeat;
      background-position: center, center;
      border:1px solid var(--accent-2); box-shadow:0 0 24px rgba(96,165,250,0.25); overflow:hidden;
      padding:58px 50px; margin-bottom:16px; min-height:280px;
      display:flex; align-items:center;
    }
    .hero-content{ position:relative; z-index:2; max-width:560px; }
    .hero-eyebrow{ display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent-2); margin-bottom:12px; }
    .hero-eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 8px var(--accent-glow); }
    .hero-title-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .hero h1{ font-family:var(--font-display); font-size:44px; line-height:1; margin-bottom:10px; }
    .hero-rank-badge{
      display:flex; align-items:center; gap:8px; flex-shrink:0; margin-bottom:10px;
      background:var(--bg-card); border:1px solid var(--accent-dim); border-radius:20px;
      padding:8px 16px;
    }
    .hero-rank-badge .label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; }
    .hero-rank-badge .value{ font-family:var(--font-head); font-weight:700; font-size:17px; color:#fff; }
    .hero-sub{ font-family:var(--font-head); font-size:19px; font-weight:600; color:var(--accent-2); margin-bottom:12px; }
    .hero-desc{ font-size:14.5px; color:var(--text-dim); line-height:1.55; max-width:480px; }

    .card{ background:var(--bg-panel); border:1px solid var(--accent-dim); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
    .enter-gate{ text-align:center; padding:40px 24px; }
    .stat-row{ display:flex; gap:14px; flex-wrap:nowrap; margin:14px 0; justify-content:center; align-items:stretch; }
    .stat{ background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:10px 16px; min-width:0; flex:1 1 0; white-space:nowrap; text-align:center; }
    .hero-leaderboard-pill{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; flex-shrink:0; color:#fff; }
    .stat .label{ font-size:11px; color:#fff; text-transform:uppercase; }
    .stat .value{ font-family:var(--font-head); font-weight:700; font-size:18px; margin-top:2px; color:#fff; }
    .btn-primary{ background:var(--accent); color:#fff; font-family:var(--font-head); font-weight:700; font-size:15px; padding:12px 24px; border-radius:8px; }
    .btn-primary:hover{ background:var(--accent-dim); }
    .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
    .btn-secondary{ background:var(--bg-card); color:var(--text-dim); border:1px solid var(--border); font-family:var(--font-head); font-weight:700; font-size:13px; padding:9px 16px; border-radius:8px; }
    .btn-secondary:hover{ border-color:var(--border-hover); color:var(--text); }

    .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
    .progress-text{ font-size:13px; color:var(--text-dim); }
    .progress-text strong{ color:var(--text); }

    .round-header{
      font-family:var(--font-head); font-weight:700; font-size:16px; margin:14px 0 0;
      display:flex; flex-wrap:wrap; align-items:center; gap:10px; cursor:pointer; user-select:none;
      background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px;
      transition:border-color .15s;
    }
    .round-header:hover{ border-color:var(--border-hover); }
    .round-header.current{ border-color:var(--accent-dim); }
    .round-header.past{ opacity:.85; }
    .round-chevron{ font-size:12px; color:var(--text-faint); flex:none; transition:transform .15s; }
    .round-title-text{ flex:none; }
    .round-summary{ margin-left:auto; font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--text-dim); display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .round-summary.tbd-summary{ color:var(--text-faint); font-weight:500; }
    /* Real bug fixed here: this selector required a .round-title
       ancestor that doesn't actually exist in the markup - the badge
       has always rendered with zero styling, just bare unstyled text,
       which is exactly what made "1pt each" look broken next to the
       round title instead of a proper pill. */
    .badge{ font-size:11px; font-weight:600; background:var(--accent-dim); color:#fff; padding:3px 10px; border-radius:12px; flex:none; }
    .round-explainer{
      display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.5;
      color:var(--text-dim); background:rgba(59,130,246,0.08); border:1px solid var(--accent-dim);
      border-radius:10px; padding:11px 14px; margin:8px 0 10px;
    }
    .round-explainer i{ color:var(--accent-2); font-size:13px; margin-top:2px; flex:none; }
    @media (max-width:480px){
      /* Chevron/title/badge always stay together on one line - they're
         short and always fit. The status summary (which can be a much
         longer string like "Picks submitted, awaiting results") gets
         its own full-width line underneath instead of being squeezed
         into a narrow column and word-wrapping awkwardly. */
      .round-summary{ flex-basis:100%; margin-left:0; margin-top:2px; white-space:normal; }
    }
    .match-row{ display:flex; align-items:stretch; gap:10px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
    .match-row.finished{ border-color:var(--green); }
    .pick-btn{ flex:1; display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-panel); font-weight:600; font-size:13.5px; transition:.15s; text-align:left; }
    .pick-btn:hover{ border-color:var(--border-hover); }
    .pick-btn.selected{ border-color:var(--accent-2); background:rgba(59,130,246,0.15); color:#fff; }
    .pick-btn.correct{ border-color:var(--green); background:rgba(34,197,94,0.12); }
    .pick-btn.wrong{ border-color:var(--red); background:rgba(239,68,68,0.1); opacity:.7; }
    .pick-btn:disabled{ cursor:not-allowed; }
    /* Placeholder player image slot - swaps to a real photo once names
       and player images are added after the PDC releases the draw. */
    .pick-avatar{ width:30px; height:30px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
    .pick-avatar-photo img{ width:100%; height:100%; object-fit:cover; }
    .pick-avatar i{ font-size:12px; color:var(--text-faint); }
    .pick-btn.selected .pick-avatar{ border-color:var(--accent-2); }
    .vs-label{ font-family:var(--font-head); font-size:11px; color:var(--text-faint); flex:none; display:flex; align-items:center; }
    .match-points{ font-family:var(--font-head); font-size:12px; font-weight:700; color:var(--text-faint); flex:none; display:flex; align-items:center; justify-content:flex-end; padding-left:6px; width:52px; }
    .match-points.earned{ color:var(--gold); }
    .tbd{ color:var(--text-faint); font-style:italic; font-size:13px; padding:8px; }

    /* ---------- Big-card pick UI ---------- */
    /* Each match is two full player-card images side by side, at a
       consistent size regardless of whether a real photo exists yet -
       the whole card is the clickable "this is my pick" target, not a
       small button with a name next to a tiny avatar. */
    .match-row-cards{ margin-bottom:16px; }
    /* Score guess for Quarter-Finals, Semi-Finals and the Final - real
       World Grand Prix set options only, shown once a winner's picked. */
    .score-picker{ margin-top:10px; text-align:center; }
    .score-picker-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
    .score-picker-options{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
    .score-picker-btn{
      font-family:var(--font-head); font-weight:700; font-size:13px; padding:6px 14px;
      border-radius:8px; border:1.5px solid var(--border); background:var(--bg-card); color:var(--text);
      cursor:pointer; transition:.15s;
    }
    .score-picker-btn:hover{ border-color:var(--border-hover); }
    .score-picker-btn.selected{ border-color:var(--accent-2); background:var(--accent-2); color:#fff; }
    .score-picker-result{ margin-top:10px; text-align:center; font-size:12.5px; color:var(--text-dim); }
    .score-picker-result.correct{ color:var(--green); font-weight:700; }
    /* Centered on the page, and using flex order (not separate markup
       per breakpoint) to rearrange the same 5 elements - card/stats/VS/
       stats/card - differently depending on screen size. Desktop reads
       [P1 card][P1 stats] VS [P2 stats][P2 card]: stats flank a big
       central VS, photos on the outside. Mobile groups each player's
       card with its own stats stacked underneath instead. */
    .match-cards-pair{ display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:12px; }
    .pick-card-btn{
      position:relative; border-radius:14px; overflow:hidden;
      border:2px solid var(--border); background:var(--bg-panel);
      aspect-ratio:3/4; cursor:pointer; padding:0; transition:.15s;
      width:220px; flex:0 0 220px;
    }
    .pick-card-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
    .pick-card-btn:hover:not(:disabled){ border-color:var(--border-hover); }
    .pick-card-btn.selected{ border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(59,130,246,0.35); }
    .pick-card-btn.correct{ border-color:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,0.35); }
    .pick-card-btn.wrong{ border-color:var(--red); opacity:.5; }
    .pick-card-btn:disabled{ cursor:not-allowed; }
    .pick-card-noimg{
      width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:8px; padding:10px; text-align:center; background:var(--bg-card);
    }
    .pick-card-noimg i{ font-size:30px; color:var(--text-faint); }
    .pick-card-name{ font-family:var(--font-head); font-weight:700; font-size:13px; line-height:1.25; }
    .pick-card-check{
      position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
      background:var(--accent-2); color:#fff; display:none; align-items:center; justify-content:center; font-size:13px;
      box-shadow:0 2px 6px rgba(0,0,0,0.45);
    }
    .pick-card-btn.selected .pick-card-check{ display:flex; }
    /* Real fix here: the tick used to turn green on a correct pick,
       on top of the card's own border also turning green - two green
       signals for the same fact, confusing rather than clarifying. The
       tick now only ever means one thing (this is who you picked) and
       always stays blue; the border alone tells you if that pick won. */
    .pick-card-points{
      position:absolute; top:38px; right:8px; padding:3px 8px; border-radius:10px;
      font-family:var(--font-head); font-weight:700; font-size:11px; color:#fff;
      background:rgba(0,0,0,0.55); box-shadow:0 2px 6px rgba(0,0,0,0.45); white-space:nowrap;
    }
    .pick-card-points.earned{ background:var(--green); }
    /* Bigger, more dramatic VS on desktop, sitting between the two cards
       at the true centre of the row. */
    .vs-label-big{
      font-family:var(--font-head); font-size:34px; color:var(--text-dim); flex:none;
      font-weight:700; align-self:center; padding:0 6px; opacity:.85; order:2;
    }

    .card-slot.slot-0{ order:1; }
    .card-slot.slot-1{ order:3; }

    .submit-msg{ text-align:center; font-size:13px; margin-top:10px; }
    .loading, .empty{ text-align:center; padding:40px; color:var(--text-dim); }
    /* Mobile hamburger drawer — standard across every page */
    .icon-btn.menu-toggle{ display:none; }
    .mobile-nav-overlay{ display:none; position:fixed; inset:0; z-index:198; background:rgba(0,0,0,0.5); }
    .mobile-nav-overlay.open{ display:block; }
    .mobile-nav-drawer{
      display:none; position:fixed; top:0; right:0; bottom:0; z-index:199; width:78%; max-width:300px;
      background:var(--bg-panel); border-left:1px solid var(--border); padding:80px 24px 24px;
      flex-direction:column; gap:4px; transform:translateX(100%); transition:transform .25s ease;
    }
    .mobile-nav-drawer.open{ display:flex; transform:translateX(0); }
    .mobile-nav-drawer a{ padding:12px 10px; border-radius:10px; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text-dim); }
    .mobile-nav-drawer a:hover{ background:var(--bg-card); color:var(--text); }

    @media (max-width:640px){
      .navbar{ padding:12px 16px; flex-wrap:nowrap; align-items:center; }
      .nav-left{ display:contents; }
      .nav-right{ display:contents; }
      .nav-links{ display:none; }
      .logo{ gap:8px; }
      .logo-mark{ width:32px; height:32px; }
      .logo-text{ font-size:14px; }
      .logo-text .sub{ font-size:9px; letter-spacing:2px; }
      .avatar-btn{ margin-left:10px; padding:2px; }
      .avatar-btn .avatar{ width:34px; height:34px; }
      .icon-btn.menu-toggle{ display:flex; margin-left:auto; }
      main{ padding:0 0 60px; box-sizing:border-box; max-width:100%; }
      /* Real fix here: this used a negative-margin "full bleed" trick to
         break out of main's old 14px side padding - now that main has
         no side padding left to break out of at all, that same -14px
         margin just pulled the hero 14px past the actual screen edge on
         both sides, causing a real horizontal scroll. No longer needed. */
      .hero{
        padding:28px 22px; min-height:auto; border-radius:0;
        margin:0; width:auto;
      }
      .hero h1{ font-size:32px; }
      .hero-sub{ font-size:15px; }
      .hero-desc{ font-size:13px; }
      /* Real fix, not a guess - stats were overflowing because 3 fixed
         min-width:110px boxes plus gaps genuinely don't fit on a real
         phone screen after page/card padding, confirmed the same real
         cause found on the stock market summary cards earlier. */
      .stat-row{ gap:6px !important; }
      .stat{ min-width:0 !important; flex:1 1 0; padding:8px 4px !important; }
      .stat .label{ font-size:8.5px !important; white-space:normal !important; line-height:1.2; }
      .stat .value{ font-size:14px !important; }
      #root{ max-width:100% !important; }
      .pick-btn{ font-size:11px; padding:6px 7px; gap:6px; }
      .pick-avatar{ width:22px; height:22px; }
      .match-points{ display:none; }
      .match-row{ gap:6px; padding:8px; }
      .match-cards-pair{ gap:8px; row-gap:10px; }
      .pick-card-name{ font-size:11px; }
      .pick-card-noimg i{ font-size:22px; }
      .pick-card-check{ width:20px; height:20px; font-size:10px; top:5px; right:5px; }
      /* Real fix here: VS was forced onto its own row above the two
         cards (flex-basis:100%, order:0) instead of sitting between
         them - now sits in the middle, cards pulled left/right to make
         room, matching how it already worked on desktop. */
      .vs-label-big{ order:2; flex:0 0 26px; width:26px; padding:0; box-sizing:border-box; text-align:center; font-size:14px; align-self:center; }
      .card-slot.slot-0{ order:1; width:calc(50% - 23px); flex:0 0 calc(50% - 23px); }
      .card-slot.slot-1{ order:3; width:calc(50% - 23px); flex:0 0 calc(50% - 23px); }
      /* Background section now genuinely full width on mobile, via the
         consolidated main{padding:0 0 60px} rule above. */
      #root{ border-radius:0; }
    }
  </style>
</head>
<body>
  <!-- Real fix here: this page (like almost every page except the hub)
       used FontAwesome icons in the nav, while the hub uses its own
       custom hand-drawn SVG icon set - same container size, visibly
       different icon graphics. This sprite is copied exactly from the
       hub so the nav genuinely looks identical, not just sized the same. -->
  <svg style="display:none">
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z"/><path d="M7 5H4a3 3 0 0 0 3 3"/><path d="M17 5h3a3 3 0 0 1-3 3"/><path d="M12 12v3"/><path d="M9 19h6"/><path d="M10 16h4l1 3H9l1-3z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8z"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c0-3.6 3-6.2 7-6.2s7 2.6 7 6.2"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>

  <div class="bg-glow"></div>

  <header class="navbar">

        <div class="avatar" id="navAvatar"><svg class="icon" style="width:14px; height:14px; color:var(--text-dim);"><use href="#i-user"/></svg></div>

    <a href="/">GB Hub</a>
    <a href="/darts">Darts</a>
    <a href="/wallet">Wallet</a>
  </div>

  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="hero-eyebrow"><span class="dot"></span>Bracket Pool</div>
        <div class="hero-title-row">
          <h1>World Grand Prix</h1>
          <div id="heroRankBadge"></div>
        </div>
        <div class="hero-sub">Predict Every Match. Double Points Each Round.</div>
        <p class="hero-desc" id="heroDesc">Knockout bracket. Pick the winner of each match, round by round, as every round unlocks with the real results.</p>
        <div class="stat-row" id="heroStatRow" style="margin:16px 0 0; justify-content:flex-start;">
          <div id="heroStatsInner" style="display:contents;"></div>
          <a href="/darts-leaderboard" class="btn-secondary hero-leaderboard-pill">
            <i class="fas fa-ranking-star"></i> Leaderboard
          </a>
        </div>
      </div>
    </section>

    <div id="root"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
  </main>

  <script src="toast.js"></script>
  <script>
    let TOURNAMENT_ID = null;
    let bracketData = null;
    let myPicks = {}; // "round-match" -> player_id
    let myScores = {}; // "round-match" -> "3-1" style set score, QF/SF/Final only
    // Real World Grand Prix set format - the only valid winning scores
    // for each of these three rounds. Last 32/Last 16 don't use this.
    const VALID_SCORES_BY_ROUND = {
      3: ['3-0', '3-1', '3-2'],
      4: ['5-0', '5-1', '5-2', '5-3', '5-4'],
      5: ['6-0', '6-1', '6-2', '6-3', '6-4', '6-5']
    };
    let currentUser = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function authHeaders() {
      const token = localStorage.getItem('gbf_token');
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    async function api(action, body = {}) {
      const response = await fetch('/api/tournaments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ action, ...body })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }

    function playerName(id) {
      if (!id) return null;
      const p = bracketData.players.find(pl => pl.id === id);
      return p ? p.name : 'Unknown';
    }

    // Master folder for real darts player headshots: frontend/assets/DARTS CARDS
    // Matched against your real files (Title-Case-Hyphenated, .png,
    // apostrophe replaced with underscore - e.g. "Ross Smith" ->
    // Ross-Smith.png, "William O'Connor" -> William-O_connor.png).
    // Generates every reasonable casing combination automatically for
    // names with a lowercase connector word (van/de/etc, e.g. "Gian van
    // Veen") and apostrophe cases, rather than needing to know your
    // exact convention in advance - tries each guess in turn and only
    // falls back to the plain person icon if none of them exist.
    const DARTS_PHOTO_FOLDER = 'assets/DARTS CARDS';

    function playerPhotoCandidates(name) {
      if (!name) return [];
      const words = name.split(' ').filter(Boolean);

      // Each word gets 1 or 2 case variants: a lowercase connector word
      // like "van" tries both "van" and "Van", since we don't know
      // which the real files use.
      const wordVariants = words.map(w => {
        const cleaned = w.replace(/'/g, '_');
        if (/^[a-z]/.test(cleaned)) {
          return [...new Set([cleaned, cleaned.charAt(0).toUpperCase() + cleaned.slice(1)])];
        }
        return [cleaned];
      });

      // Cartesian product of all word variants, joined by hyphen.
      let combos = [''];
      wordVariants.forEach(variants => {
        const next = [];
        combos.forEach(prefix => {
          variants.forEach(v => next.push(prefix ? `${prefix}-${v}` : v));
        });
        combos = next;
      });

      // For any apostrophe case (now an underscore), also try lowercasing
      // the letter right after it - confirmed real inconsistency: one
      // actual file uses "O_connor", not "O_Connor".
      const withLowerAfterUnderscore = combos.map(c => c.replace(/_([A-Z])/g, (m, ch) => '_' + ch.toLowerCase()));

      const all = [...new Set([...combos, ...withLowerAfterUnderscore])];
      return all.map(c => `${DARTS_PHOTO_FOLDER}/${c}.png`);
    }
    function playerPhotoUrl(id) {
      const name = playerName(id);
      if (!name || name === 'Unknown') return null;
      const candidates = playerPhotoCandidates(name);
      return candidates.length ? candidates[0] : null;
    }
    // Full candidate list, used by the onerror chain to try the second
    // guess before giving up and showing the icon.
    function playerPhotoAllCandidates(id) {
      const name = playerName(id);
      if (!name || name === 'Unknown') return [];
      return playerPhotoCandidates(name);
    }

    // Chains through every candidate filename in turn (2-4 depending on
    // the name's connector words/apostrophes) before finally falling
    // back to a plain name+icon card - real bug fixed here: candidates
    // are always *guessed* URLs (we can't know a file exists until we've
    // tried loading it), so every real player name was taking the "has
    // a photo" path and, once every guess 404'd, landing on a bare icon
    // with no name at all instead of the proper no-photo card design.
    //
    // Real bug fixed here, confirmed on William O'Connor specifically:
    // the name used to be passed as a 4th inline argument, HTML-entity-
    // escaped (&#39; for the apostrophe). That looks safe, but HTML
    // entities are decoded by the browser's HTML PARSER before the
    // resulting text is ever handed to the JS engine as executable
    // code - so by the time this onerror string actually ran, the
    // apostrophe was back to a literal ' in the middle of a JS string
    // literal, breaking it into three fragments and throwing a silent
    // syntax error. Every name without an apostrophe worked fine; only
    // O'Connor (the one real name with one) was ever affected. Fixed by
    // reading the name from the image's own alt attribute at runtime
    // instead - a normal HTML attribute the browser decodes safely on
    // its own, with no JS string embedding involved at all.
    window.tryNextDartsPhoto = function(imgEl, candidatesJson, idx) {
      const candidates = JSON.parse(candidatesJson);
      const nextIdx = idx + 1;
      if (nextIdx >= candidates.length) {
        const safeName = document.createElement('div');
        safeName.textContent = imgEl.alt || '';
        // Capture the parent BEFORE replacing its innerHTML - setting
        // .innerHTML detaches imgEl from the DOM entirely, so reading
        // imgEl.parentElement again afterward returns null. Real bug
        // caught while testing the fix above: every placeholder player
        // (no real photo yet) was throwing here.
        const parent = imgEl.parentElement;
        // Real bug fixed here, found while testing the new per-card
        // points badge: this used to hardcode the check badge and drop
        // anything else already sitting in the card (the points badge
        // specifically), since a 404'd photo is common (any player
        // without a real photo yet) and this rebuild silently wiped it
        // every time. Now preserves whatever badges were actually there
        // instead of assuming only the check mark exists.
        const existingCheck = parent.querySelector('.pick-card-check');
        const existingPoints = parent.querySelector('.pick-card-points');
        const checkHtml = existingCheck ? existingCheck.outerHTML : '<span class="pick-card-check"><i class="fas fa-check"></i></span>';
        const pointsHtml = existingPoints ? existingPoints.outerHTML : '';
        parent.innerHTML = `<div class="pick-card-noimg"><i class="fas fa-user"></i><span class="pick-card-name">${safeName.innerHTML}</span></div>${checkHtml}${pointsHtml}`;
        parent.classList.add('no-photo');
        return;
      }
      imgEl.onerror = function(){ tryNextDartsPhoto(imgEl, candidatesJson, nextIdx); };
      imgEl.src = candidates[nextIdx];
    };

    function getMatch(round, matchNumber) {
      return bracketData.matches.find(m => m.round === round && m.match_number === matchNumber);
    }

    function getPickableOptions(round, matchNumber) {
      const m = getMatch(round, matchNumber);
      return [m.player1_id, m.player2_id];
    }

    // Click a pick once to select it; click the SAME one again to
    // deselect it. Only one match's pick changes per click — no
    // downstream clearing needed anymore, since every round's options
    // are always the real, confirmed players, never dependent on an
    // earlier pick the user made themselves.
    function selectPick(round, matchNumber, playerId) {
      const key = `${round}-${matchNumber}`;
      if (myPicks[key] === playerId) {
        delete myPicks[key];
        delete myScores[key]; // clearing the winner pick clears any score guess tied to it too
      } else {
        myPicks[key] = playerId;
      }
      renderBracket();
    }

    function selectScore(round, matchNumber, score) {
      const key = `${round}-${matchNumber}`;
      myScores[key] = score;
      renderBracket();
    }

    // Clears only picks that haven't been submitted yet — anything
    // already locked in from a finished match, or a round the user
    // already submitted, stays exactly as it was.
    function clearPendingPicks() {
      Object.keys(myPicks).forEach(key => {
        const [round, matchNumber] = key.split('-').map(Number);
        const match = getMatch(round, matchNumber);
        if (match && match.status !== 'finished' && !(bracketData.my_predictions || []).some(p => p.round === round && p.match_number === matchNumber)) {
          delete myPicks[key];
        }
      });
      renderBracket();
    }

    const ROUND_NAMES = { 1: 'Last 32', 2: 'Last 16', 3: 'Quarter-Finals', 4: 'Semi-Finals', 5: 'Final' };
    const ROUND_POINTS = { 1: 1, 2: 2, 3: 4, 4: 8, 5: 16 };
    const MATCHES_PER_ROUND = { 1: 16, 2: 8, 3: 4, 4: 2, 5: 1 };

    // Persists across re-renders (picking, submitting) so a user's own
    // manual expand/collapse choices aren't reset every time the screen
    // redraws — only set to a sensible default once, the first time the
    // bracket successfully loads.
    let expandedRounds = null;

    function getRoundState(round) {
      const matches = Array.from({length: MATCHES_PER_ROUND[round]}, (_, i) => getMatch(round, i + 1));
      const determined = matches.filter(m => m.player1_id && m.player2_id);
      if (determined.length === 0) return 'future';
      const allFinished = determined.length === matches.length && determined.every(m => m.status === 'finished');
      return allFinished ? 'past' : 'current';
    }

    function toggleRound(round) {
      if (expandedRounds.has(round)) expandedRounds.delete(round);
      else expandedRounds.add(round);
      renderBracket();
    }

    async function renderHeroStats(t, entry) {
      const heroStatsInner = document.getElementById('heroStatsInner');
      const heroRankBadge = document.getElementById('heroRankBadge');
      if (!heroStatsInner) return;

      // Current rank - moved out of the stat row and placed top-right
      // next to the H1 instead - confirmed real problem: with 4 items
      // (Entries/Prize/Points/Rank) plus the Leaderboard button all
      // competing for the same row, the button was getting pushed off
      // the visible width entirely on narrower screens.
      if (entry && currentUser && heroRankBadge) {
        try {
          const token = localStorage.getItem('gbf_token');
          const res = await fetch('/api/tournaments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ action: 'darts_get_leaderboard', tournament_id: t.id })
          });
          const data = await res.json();
          const mine = (data.leaderboard || []).find(r => r.user_id === currentUser.id);
          if (mine) {
            heroRankBadge.innerHTML = `<div class="hero-rank-badge"><span class="label">Current Rank</span><span class="value">#${mine.rank}</span></div>`;
          }
        } catch (e) {
          console.error('Failed to load current rank:', e);
        }
      }

      heroStatsInner.innerHTML = `
        <div class="stat"><div class="label">Entries</div><div class="value">${t.current_entries || 0}</div></div>
        <div class="stat"><div class="label">Prize Pool</div><div class="value">£${((t.prize_pool||0)/100).toFixed(2)}</div></div>
        ${entry
          ? `<div class="stat"><div class="label">Your Points</div><div class="value">${entry.entry_points}</div></div>`
          : `<div class="stat"><div class="label">Entry Fee</div><div class="value">£${((t.entry_fee||0)/100).toFixed(2)}</div></div>`}
      `;
    }

    function renderBracket() {
      const t = bracketData.tournament;
      const locked = t.status !== 'upcoming';
      const entry = bracketData.my_entry;
      renderHeroStats(t, entry);

      // Real, computed warning (not a guess) - draw_finalized comes
      // straight from the API checking whether any of the 32 slots is
      // still a placeholder name. Shown before someone commits to
      // entering, since there's nothing meaningful to look at yet - the
      // field itself isn't decided, let alone who plays who.
      const drawPendingWarning = (t.draw_finalized === false)
        ? `<div style="max-width:440px; margin:0 auto 18px; padding:10px 14px; border:1px solid var(--gold); border-radius:8px; background:rgba(242,185,61,0.08); font-size:13px; color:var(--gold); display:flex; align-items:center; gap:8px; text-align:left;">
             <i class="fas fa-hourglass-half"></i>
             <span>The real draw hasn't been made yet — you're welcome to enter now, but there's nothing to predict until the field and Round 1 pairings are announced closer to the date.</span>
           </div>`
        : '';

      // Not entered yet — show tournament details and an Enter button,
      // same pattern as Predictions/LMS. The bracket itself only appears
      // once they're actually in.
      if (!currentUser) {
        document.getElementById('root').innerHTML = `
          <div class="card enter-gate">
            <i class="fas fa-bullseye" style="font-size:36px; color:var(--gold); margin-bottom:14px;"></i>
            <h2 style="font-family:var(--font-head); font-size:21px; margin-bottom:8px;">Enter the World Grand Prix</h2>
            <p style="max-width:440px; margin:0 auto 18px; font-size:14px; color:var(--text-dim);">${escapeHtml(t.description || '')}</p>
            ${drawPendingWarning}
            <a href="/login?redirect=%2Fdarts" class="btn-primary" style="display:inline-block;"><i class="fas fa-right-to-bracket"></i> Log In to Enter</a>
          </div>`;
        return;
      }

      if (!entry) {
        document.getElementById('root').innerHTML = `
          <div class="card enter-gate">
            <i class="fas fa-bullseye" style="font-size:36px; color:var(--gold); margin-bottom:14px;"></i>
            <h2 style="font-family:var(--font-head); font-size:21px; margin-bottom:8px;">Enter the World Grand Prix</h2>
            <p style="max-width:440px; margin:0 auto 18px; font-size:14px; color:var(--text-dim);">${escapeHtml(t.description || '')}</p>
            ${drawPendingWarning}
            <button class="btn-primary" id="enterBtn" onclick="enterTournament()"><i class="fas fa-right-to-bracket"></i> Enter Now</button>
            <div class="submit-msg" id="enterMsg"></div>
          </div>`;
        return;
      }

      // Entered, but the real draw doesn't exist yet — showing the
      // bracket here would mean picking a winner between "Seed 1" and
      // "Qualifier 1", which means nothing. Show the rules and an honest
      // status instead, and come back to the real picks screen the
      // moment the draw is in.
      if (t.draw_finalized === false) {
        document.getElementById('root').innerHTML = `
          <div class="card">
            <i class="fas fa-check-circle" style="font-size:28px; color:var(--accent-2); margin-bottom:10px;"></i>
            <h2 style="font-family:var(--font-head); font-size:19px; margin-bottom:4px;">You're in</h2>
            <p style="font-size:14px; color:var(--text-dim); margin-bottom:18px;">Your spot in the ${((t.prize_pool||0)/100) > 0 ? 'prize pool' : 'World Grand Prix'} is confirmed. Here's how it works, and what happens next.</p>
            <div style="text-align:left; max-width:520px; margin:0 auto 18px; padding:14px 16px; border:1px solid var(--border); border-radius:8px; background:var(--bg-2);">
              <div style="font-weight:700; margin-bottom:8px;">The rules</div>
              <ul style="margin:0; padding-left:18px; font-size:13px; color:var(--text-dim); line-height:1.7;">
                <li>32-player knockout bracket, 5 rounds — Last 32 through to the Final.</li>
                <li>Each round, pick the winner of every match before it starts.</li>
                <li>Points double each round: Last 32 is worth 1pt a correct pick, Last 16 is 2pts, Quarter-Finals 4pts, Semi-Finals 8pts, the Final 16pts.</li>
                <li>A round locks the moment its first match starts — no picks after that.</li>
              </ul>
            </div>
            <div style="max-width:520px; margin:0 auto; padding:10px 14px; border:1px solid var(--gold); border-radius:8px; background:rgba(242,185,61,0.08); font-size:13px; color:var(--gold); display:flex; align-items:center; gap:8px; text-align:left;">
              <i class="fas fa-hourglass-half"></i>
              <span>The real 32-player field and Round 1 draw haven't been announced yet. Come back once they are — this page will automatically switch to the picks screen for Round 1.</span>
            </div>
          </div>`;
        return;
      }

      // Entered — show the bracket itself
      let html = locked
        ? `<div class="card"><div class="submit-msg" style="color:var(--red);"><i class="fas fa-lock"></i> Predictions are locked — the bracket has started.</div></div>`
        : '';

      if (!locked) {
        html += `
          <div class="toolbar" style="flex-wrap:wrap;">
            <span class="progress-text">Pick winners round by round as each one unlocks</span>
            <button class="btn-secondary" onclick="clearPendingPicks()"><i class="fas fa-rotate-left"></i> Clear All</button>
          </div>
          <div style="font-size:12px; color:#eab308; background:rgba(234,179,8,0.1); border:1px solid rgba(234,179,8,0.35); border-radius:8px; padding:8px 12px; margin:-6px 0 16px; line-height:1.5;">
            <i class="fas fa-triangle-exclamation"></i> You have to pick <strong>all</strong> games in the round at once, before the deadline (kick-off of the first game in that round). Miss the deadline and you miss the whole round!
          </div>`;
      }

      // Default expand state: only ever set once per page load, so a
      // user's own manual toggles survive every subsequent re-render.
      if (expandedRounds === null) {
        expandedRounds = new Set();
        for (let r = 1; r <= 5; r++) { if (getRoundState(r) === 'current') expandedRounds.add(r); }
      }

      for (let round = 1; round <= 5; round++) {
        const state = getRoundState(round);
        const isOpen = expandedRounds.has(round);
        const roundPreds = (bracketData.my_predictions || []).filter(p => p.round === round);
        const roundPointsEarned = roundPreds.reduce((sum, p) => sum + (p.points_earned || 0), 0);
        const roundCorrectCount = roundPreds.filter(p => (p.points_earned || 0) > 0).length;

        const scoredCount = roundPreds.filter(p => p.points_earned != null).length;

        let summaryHtml = '';
        if (state === 'future') {
          summaryHtml = `<span class="round-summary tbd-summary"><i class="fas fa-lock"></i> Waiting on the previous round</span>`;
        } else if (state === 'past') {
          summaryHtml = `<span class="round-summary"><strong style="color:var(--gold);">${roundPointsEarned} pt${roundPointsEarned===1?'':'s'}</strong> · ${roundCorrectCount}/${roundPreds.length} correct</span>`;
        } else if (scoredCount > 0) {
          summaryHtml = `<span class="round-summary"><strong style="color:var(--gold);">${roundPointsEarned} pt${roundPointsEarned===1?'':'s'}</strong> so far · ${roundCorrectCount}/${scoredCount} correct</span>`;
        } else if (roundPreds.length > 0) {
          summaryHtml = `<span class="round-summary" style="color:var(--accent-2);"><i class="fas fa-check"></i> Picks submitted, awaiting results</span>`;
        }

        html += `
          <div class="round-header ${state}" onclick="toggleRound(${round})">
            <i class="fas fa-chevron-${isOpen ? 'down' : 'right'} round-chevron"></i>
            <span class="round-title-text">${ROUND_NAMES[round]}</span>
            <span class="badge">${ROUND_POINTS[round]} pt${ROUND_POINTS[round]>1?'s':''} each</span>
            ${summaryHtml}
          </div>`;

        if (!isOpen) continue;

        // Real explanation, not just a one-line status — shown once a
        // pick is genuinely locked in for this round and nothing's been
        // scored yet, so it's clear what happens next without needing
        // to already know how the picker works.
        if (roundPreds.length > 0 && scoredCount === 0 && state !== 'future') {
          html += `
            <div class="round-explainer">
              <i class="fas fa-circle-info"></i>
              <span>You've picked this round — below are the matches, with the player you chose highlighted.
              If they win their match, that pick turns <strong style="color:var(--green);">green</strong>;
              if they lose, it turns <strong style="color:var(--red);">red</strong>.
              Each correct pick earns you <strong style="color:var(--gold);">${ROUND_POINTS[round]} point${ROUND_POINTS[round]>1?'s':''}</strong> this round.</span>
            </div>`;
        }

        if (state === 'future') {
          html += `<div class="match-row"><span class="tbd">Waiting on the previous round to finish</span></div>`;
          continue;
        }

        let roundHasAvailableMatch = false;
        const alreadySubmittedThisRound = roundPreds.length > 0;
        for (let m = 1; m <= MATCHES_PER_ROUND[round]; m++) {
          const match = getMatch(round, m);
          const options = getPickableOptions(round, m);
          const bothKnown = options[0] && options[1];
          const myPick = myPicks[`${round}-${m}`];
          const finished = match.status === 'finished';

          if (!bothKnown) {
            html += `<div class="match-row"><span class="tbd">Waiting on the previous round to finish</span></div>`;
            continue;
          }
          if (!finished && !alreadySubmittedThisRound) roundHasAvailableMatch = true;

          // Points earned specifically from this match, if the user has
          // a scored prediction for it — real per-match feedback, not
          // just the round-level total.
          const matchPrediction = (bracketData.my_predictions || []).find(p => p.round === round && p.match_number === m);
          const matchPointsEarned = matchPrediction && matchPrediction.points_earned != null ? matchPrediction.points_earned : null;

          html += `<div class="match-row-cards ${finished ? 'finished' : ''}">`;
          html += `<div class="match-cards-pair">`;
          options.forEach((pid, i) => {
            let cls = 'pick-card-btn';
            if (myPick === pid) cls += ' selected';
            // The real result colours the actual winner/loser directly —
            // confirmed real gap in the old logic: it only coloured a
            // button if it was BOTH the winner AND the user's own pick,
            // so a correctly-shown loser or an unpicked winner displayed
            // with no colour at all.
            if (finished && match.winner_id === pid) cls += ' correct';
            if (finished && match.winner_id && match.winner_id !== pid) cls += ' wrong';
            const disabled = (locked || finished || alreadySubmittedThisRound) ? 'disabled' : '';
            const name = playerName(pid);
            const photoCandidates = playerPhotoAllCandidates(pid);
            const checkBadge = `<span class="pick-card-check"><i class="fas fa-check"></i></span>`;

            // Per-card points feedback, sitting right under the tick -
            // only on the card the user actually picked. Showing it on
            // the unpicked winner too (even just "0pt") ended up
            // confusing rather than clarifying, since two badges on the
            // same match read like two separate results.
            let pointsBadge = '';
            if (finished && pid === myPick && matchPointsEarned !== null) {
              pointsBadge = `<span class="pick-card-points ${matchPointsEarned > 0 ? 'earned' : ''}">${matchPointsEarned > 0 ? '+' : ''}${matchPointsEarned}pt${Math.abs(matchPointsEarned) === 1 ? '' : 's'}</span>`;
            }

            let cardInner;
            if (photoCandidates.length === 0) {
              // No real card image yet for this player - a plain
              // name-only placeholder at the exact same size, so the row
              // never looks broken or mismatched while photos are added
              // one at a time.
              cardInner = `
                <div class="pick-card-noimg">
                  <i class="fas fa-user"></i>
                  <span class="pick-card-name">${escapeHtml(name)}</span>
                </div>${checkBadge}${pointsBadge}`;
            } else {
              const candidatesJsonEscaped = JSON.stringify(photoCandidates).replace(/"/g, '&quot;');
              cardInner = `
                <img src="${photoCandidates[0]}" alt="${escapeHtml(name)}" onerror="tryNextDartsPhoto(this, '${candidatesJsonEscaped}', 0)">
                ${checkBadge}${pointsBadge}`;
            }
            cls += photoCandidates.length === 0 ? ' no-photo' : '';
            // Flat, order-controlled elements rather than nested columns -
            // on desktop this naturally reads [P1 card][P1 stats] VS
            // [P2 stats][P2 card], stats flanking a big central VS with
            // photos on the outside; on mobile a CSS override alone
            // regroups the exact same elements into [P1 card][P1 stats]
            // then [P2 card][P2 stats] stacked, no separate markup needed.
            html += `<button class="${cls} card-slot slot-${i}" ${disabled} onclick="selectPick(${round},${m},'${pid}')">${cardInner}</button>`;
            if (i === 0) html += `<span class="vs-label-big">VS</span>`;
          });
          html += `</div>`;
          // Real duplication removed here: this used to repeat the same
          // points value as a separate line sitting outside the cards,
          // below the whole pair - now that the picked player's own
          // card shows it directly, this second copy just floated there
          // disconnected from which player it was even about, especially
          // confusing on mobile where it had nothing visually tying it
          // back to the picked card above it.

          // Quarter-Finals, Semi-Finals and the Final each require a
          // real score guess too, not just who wins - real World Grand
          // Prix set format, shown once a winner's picked so the score
          // options can be framed around who the user actually chose
          // ("if Littler wins 3-1" reads better than a generic list).
          if (VALID_SCORES_BY_ROUND[round] && myPick && !finished && !locked && !alreadySubmittedThisRound) {
            const scoreKey = `${round}-${m}`;
            const pickedName = playerName(myPick);
            html += `
              <div class="score-picker">
                <div class="score-picker-label">Final score if ${escapeHtml(pickedName)} wins:</div>
                <div class="score-picker-options">
                  ${VALID_SCORES_BY_ROUND[round].map(s => `
                    <button class="score-picker-btn ${myScores[scoreKey] === s ? 'selected' : ''}" onclick="selectScore(${round},${m},'${s}')">${s}</button>
                  `).join('')}
                </div>
              </div>`;
          } else if (VALID_SCORES_BY_ROUND[round] && finished && matchPrediction && matchPrediction.predicted_score) {
            const scoreCorrect = match.winning_score === matchPrediction.predicted_score;
            html += `
              <div class="score-picker-result ${scoreCorrect ? 'correct' : ''}">
                You guessed ${escapeHtml(matchPrediction.predicted_score)}${match.winning_score ? ` · real score was ${escapeHtml(match.winning_score)}` : ''}
                ${scoreCorrect ? ' · +2pt bonus!' : ''}
              </div>`;
          }

          html += `</div>`;
        }

        // Submitting is final — once picks exist for this round at all,
        // there's no more editing and no more submit button, just the
        // locked-in read-only picks shown above.
        if (!locked && !alreadySubmittedThisRound && roundHasAvailableMatch) {
          const roundMatchNumbers = Array.from({length: MATCHES_PER_ROUND[round]}, (_, i) => i + 1)
            .filter(m => { const match = getMatch(round, m); return match.player1_id && match.player2_id && match.status !== 'finished'; });
          const missingNumbers = roundMatchNumbers.filter(m => !myPicks[`${round}-${m}`]);
          const roundPickedCount = roundMatchNumbers.length - missingNumbers.length;
          const roundAvailableCount = roundMatchNumbers.length;
          const isComplete = missingNumbers.length === 0;
          html += `
            <button class="btn-primary" style="width:100%; margin:6px 0 4px;" onclick="submitRoundPicks(${round})" ${isComplete ? '' : 'disabled'}>
              Submit ${ROUND_NAMES[round]} Picks — Locks Them In (${roundPickedCount}/${roundAvailableCount})
            </button>`;
          if (!isComplete) {
            html += `<div style="font-size:12.5px; color:var(--gold); text-align:center; margin-bottom:16px;">
              <i class="fas fa-triangle-exclamation"></i> Still need a pick for match${missingNumbers.length > 1 ? 'es' : ''} ${missingNumbers.join(', ')} before you can submit
            </div>`;
          }
        }
      }

      const totalPicked = Object.keys(myPicks).length;
      if (!locked) {
        html += `<div class="submit-msg" id="submitMsg"></div>`;
      }

      document.getElementById('root').innerHTML = html;
    }

    async function enterTournament() {
      const btn = document.getElementById('enterBtn');
      const msgEl = document.getElementById('enterMsg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entering…';
      try {
        await api('join', { tournament_id: TOURNAMENT_ID, tournament_type: 'darts' });
        if (window.showToast) window.showToast("You're entered! Pick this round's winners below.", 'success');
        await loadBracket();
      } catch (err) {
        msgEl.style.color = 'var(--red)';
        msgEl.textContent = err.message;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Enter Now';
      }
    }

    async function submitRoundPicks(round) {
      const msgEl = document.getElementById('submitMsg');
      const roundMatchNumbers = Array.from({length: MATCHES_PER_ROUND[round]}, (_, i) => i + 1)
        .filter(m => { const match = getMatch(round, m); return match.player1_id && match.player2_id && match.status !== 'finished'; });
      const missingNumbers = roundMatchNumbers.filter(m => !myPicks[`${round}-${m}`]);
      if (missingNumbers.length > 0) {
        msgEl.style.color = 'var(--red)';
        msgEl.textContent = `You still need to pick a winner for match${missingNumbers.length > 1 ? 'es' : ''} ${missingNumbers.join(', ')} before you can submit ${ROUND_NAMES[round]}.`;
        return;
      }
      // Quarter-Finals, Semi-Finals and the Final each require a real
      // score guess too, not just the winner - required the same way a
      // missing winner pick is, nothing saved until every match has both.
      if (VALID_SCORES_BY_ROUND[round]) {
        const missingScores = roundMatchNumbers.filter(m => !myScores[`${round}-${m}`]);
        if (missingScores.length > 0) {
          msgEl.style.color = 'var(--red)';
          msgEl.textContent = `You still need to predict the score for match${missingScores.length > 1 ? 'es' : ''} ${missingScores.join(', ')} before you can submit ${ROUND_NAMES[round]}.`;
          return;
        }
      }
      const predictions = roundMatchNumbers.map(m => ({
        match_number: m, predicted_winner_id: myPicks[`${round}-${m}`],
        predicted_score: myScores[`${round}-${m}`] || null
      }));
      msgEl.style.color = 'var(--text-dim)';
      msgEl.textContent = 'Saving…';
      try {
        await api('darts_submit_round_picks', { tournament_id: TOURNAMENT_ID, round, predictions });
        msgEl.style.color = 'var(--green)';
        msgEl.textContent = `${ROUND_NAMES[round]} picks saved!`;
        if (window.showToast) window.showToast(`${ROUND_NAMES[round]} picks saved!`, 'success');
        await loadBracket();
      } catch (err) {
        msgEl.style.color = 'var(--red)';
        msgEl.textContent = err.message;
      }
    }

    async function loadBracket() {
      try {
        if (!currentUser) {
          // darts_get_bracket requires a logged-in user (it looks up
          // your own entry/predictions) — confirmed as a real gap
          // otherwise: a logged-out visitor would hit an auth error
          // before ever seeing the tournament details. Use the existing
          // public endpoint instead, the same one the hub card already
          // uses without needing to log in first.
          const res = await fetch(`/api/tournaments?tournament_type=darts&tournament_id=${TOURNAMENT_ID}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to load tournament');
          bracketData = { tournament: data.tournament, players: [], matches: [], my_entry: null, my_predictions: [] };
          renderBracket();
          return;
        }
        bracketData = await api('darts_get_bracket', { tournament_id: TOURNAMENT_ID });
        (bracketData.my_predictions || []).forEach(p => {
          myPicks[`${p.round}-${p.match_number}`] = p.predicted_winner_id;
          if (p.predicted_score) myScores[`${p.round}-${p.match_number}`] = p.predicted_score;
        });
        renderBracket();
      } catch (err) {
        const isAuthError = /invalid or expired token|authentication required|user not found/i.test(err.message);
        if (isAuthError) {
          // The cached currentUser in localStorage doesn't mean the
          // actual server-side token is still valid — a real, normal
          // situation once a session gets old enough. Clear the stale
          // cache and prompt a real re-login rather than show a raw,
          // unhelpful error message.
          localStorage.removeItem('gbf_token');
          localStorage.removeItem('gbf_user');
          document.getElementById('root').innerHTML = `
            <div class="card enter-gate">
              <i class="fas fa-clock-rotate-left" style="font-size:32px; color:var(--gold); margin-bottom:14px;"></i>
              <h2 style="font-family:var(--font-head); font-size:19px; margin-bottom:8px;">Your session has expired</h2>
              <p style="max-width:400px; margin:0 auto 18px; font-size:14px; color:var(--text-dim);">Log back in to keep picking your bracket — nothing you've already submitted is affected.</p>
              <a href="/login?redirect=%2Fdarts" class="btn-primary" style="display:inline-block;"><i class="fas fa-right-to-bracket"></i> Log In Again</a>
            </div>`;
          return;
        }
        document.getElementById('root').innerHTML = `<div class="empty">Couldn't load the tournament: ${escapeHtml(err.message)}</div>`;
      }
    }

    function initAuth() {
      const token = localStorage.getItem('gbf_token');
      const userStr = localStorage.getItem('gbf_user');
      if (token && userStr) {
        try {
          currentUser = JSON.parse(userStr);
          document.getElementById('navAuthBtn').href = '/profile';
          document.getElementById('navAvatar').innerHTML = `<span style="font-size:13px;font-weight:700;">${escapeHtml((currentUser.display_name || currentUser.username || '?')[0].toUpperCase())}</span>`;
          document.getElementById('navAuthLabel').textContent = currentUser.display_name || currentUser.username || 'Account';
        } catch (e) { currentUser = null; }
      }
    }

    function toggleMobileNav(open) {
      document.getElementById('mobileNavDrawer').classList.toggle('open', open);
      document.getElementById('mobileNavOverlay').classList.toggle('open', open);
    }
    document.getElementById('mobileMenuBtn').addEventListener('click', () => toggleMobileNav(true));
    document.getElementById('mobileNavOverlay').addEventListener('click', () => toggleMobileNav(false));

    (async function init() {
      initAuth();
      const tParam = new URLSearchParams(window.location.search).get('t');
      // The tournament ID used to be a hardcoded constant here, pointing
      // at a specific tournament created during testing. That ID stops
      // working the moment that tournament is gone and a new one exists
      // instead (confirmed as a real, live case: a freshly-created "World
      // Grand Prix" tournament got a new ID, and this page still pointed
      // at the old one, showing "Tournament not found" even though a
      // real darts tournament genuinely existed). Look up the real
      // current tournament instead — live first, then upcoming (the
      // draft/registering phase counts as a real tournament here too,
      // same as everywhere else on the site).
      TOURNAMENT_ID = tParam || await resolveDefaultTournamentId();
      if (!TOURNAMENT_ID) {
        document.getElementById('root').innerHTML = `<div class="empty">No darts tournament is currently available.</div>`;
        return;
      }
      await loadBracket();
    })();

    async function resolveDefaultTournamentId() {
      for (const status of ['live', 'upcoming']) {
        try {
          const res = await fetch(`/api/tournaments?tournament_type=darts&status=${status}`);
          const data = await res.json();
          const list = Array.isArray(data) ? data : (data.tournaments || []);
          if (list[0]) return list[0].id;
        } catch (e) {
          console.error(`Failed to look up ${status} darts tournament:`, e);
        }
      }
      return null;
    }
  </script>
</body>
</html>
