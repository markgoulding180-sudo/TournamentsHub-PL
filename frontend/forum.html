<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root{
      --bg:#060b1e; --bg-panel:#0a1226; --bg-card:#0d1730; --bg-card-2:#101a38;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    html{ overflow-x:hidden; }
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .bg-glow{
      position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%);
      background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%);
      pointer-events:none; z-index:0;
    }

    /* ================= NAVBAR (matches the Hub) ================= */
    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    #playerPoolCard, #mySquadCard, #fmLeaderboardCard{ scroll-margin-top: 90px; }
    .nav-left{display:flex;align-items:center;gap:40px;}
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-mark .icon{width:20px;height:20px;stroke:#fff;stroke-width:1.9;}
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .nav-links{display:flex; gap:30px;}
    .nav-links a{ font-family:var(--font-head); font-size:14px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); padding-bottom:19px; position:relative; transition:color .2s; }
    .nav-links a:hover{color:var(--text);}
    .nav-links a.active{color:var(--text);}
    .nav-links a.active::after{ content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--accent-2); box-shadow:0 0 10px var(--accent-glow); border-radius:2px; }
    .nav-right{display:flex;align-items:center;gap:14px;}
    .icon-btn{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--bg-card); border:1px solid var(--border); transition:border-color .2s, transform .2s; position:relative; }
    .icon-btn .icon{width:17px;height:17px; color:var(--text-dim);}
    .icon-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
    .icon-btn:hover .icon{color:var(--accent-2);}
    .avatar-btn{display:flex;align-items:center;gap:6px; padding:4px; border-radius:22px; border:1px solid transparent; transition:border-color .2s;}
    .avatar-btn:hover{border-color:var(--border);}
    .avatar-btn{ order:1; }
    .wallet-icon-link{ order:2; }
    .bell-btn{ order:3; }
    #mobileMenuBtn{ order:5; }
    .avatar{ width:36px;height:36px;border-radius:50%; background:linear-gradient(150deg,#2c3d5c,#161f33); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; }
    .avatar .icon{width:17px;height:17px;color:var(--text-dim);}

    /* Mobile hamburger drawer — standard across every page */
    .icon-btn.menu-toggle{ display:none; }
    .mobile-nav-overlay{ display:none; position:fixed; inset:0; z-index:198; background:rgba(0,0,0,0.5); }
    .mobile-nav-overlay.open{ display:block; }
    .mobile-nav-drawer{
      display:none; position:fixed; top:0; right:0; bottom:0; z-index:199; width:78%; max-width:300px;
      background:var(--bg-panel); border-left:1px solid var(--border); padding:80px 24px 24px;
      flex-direction:column; gap:4px; transform:translateX(100%); transition:transform .25s ease;
    }
    .mobile-nav-drawer.open{ display:flex; transform:translateX(0); }
    .mobile-nav-drawer a{ padding:12px 10px; border-radius:10px; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text-dim); }
    .mobile-nav-drawer a:hover{ background:var(--bg-card); color:var(--text); }


    @media (max-width:640px){
      .navbar{ padding:12px 16px; flex-wrap:nowrap; align-items:center; }
      .nav-left{ display:contents; } .nav-right{ display:contents; } .nav-links{ display:none; }
      .logo{ order:1; gap:8px; } .logo-mark{ width:32px; height:32px; }
      .logo-text{ font-size:14px; } .logo-text .sub{ font-size:9px; letter-spacing:2px; }
      .avatar-btn{ margin-left:10px; padding:2px; } .avatar-btn.logged-in #navAuthLabel{ display:none !important; }
      .avatar-btn .avatar{ width:34px; height:34px; } .bell-btn{ margin-left:0; }
      .icon-btn.menu-toggle{ display:flex; margin-left:auto; }
    }
  /* ===== Top bar — the same on every screen size =====
     Desktop shows exactly what phones show: GB Hub logo, profile photo
     and name, wallet, notifications and the menu button. All the page
     links live in the menu. */
  .navbar .nav-links, .hub-navbar .hub-nav-links,
  .navbar .my-tournaments-btn, .navbar #logoutBtn{ display:none !important; }
  .navbar #mobileMenuBtn, .hub-navbar #mobileMenuBtn{ display:flex !important; }
  @media (min-width:861px){ .navbar > .nav-right{ margin-left:auto; } }
  .navbar .tourney-home-link{ display:flex !important; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); }


  /* ================= Forum page ================= */
  body{ background:linear-gradient(180deg, rgba(4,8,22,0.86), rgba(4,8,22,0.93)), url('assets/card-bg-sports.jpg') center top / cover fixed no-repeat, #060b1e; }
  main{ position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:12px 24px 60px; }
  @media (min-width:900px){ main{ max-width:none; padding:12px 32px 60px; } }
  @media (max-width:640px){ main{ padding:0 12px 60px; } }

  /* hero: same size as the hub's, washed default background + art on the right */
  .hero{ position:relative; overflow:hidden; background:#01061a; display:flex; align-items:center; margin-bottom:16px; }
  .hero::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(1,6,26,0.82) 0%, rgba(1,6,26,0.62) 45%, rgba(1,6,26,0.4) 100%), url('assets/card-bg-sports.jpg') center 40% / cover no-repeat; }
  .hero::after{ content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    --art-w:calc(var(--hero-h, 340px) * 1.77 * 1.06);
    background:url('assets/hero-forum.jpg') right 50% / auto 106% no-repeat;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, transparent calc(100% - var(--art-w)), #000 calc(100% - var(--art-w) + 200px));
            mask-image:linear-gradient(90deg, transparent 0, transparent calc(100% - var(--art-w)), #000 calc(100% - var(--art-w) + 200px)); }
  .hero-content{ position:relative; z-index:2; max-width:560px; }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:8px; color:var(--accent-2); font-family:var(--font-head); font-size:12px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; }
  .hero-eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 8px var(--accent-glow); }
  .hero h1{ font-family:var(--font-display); font-weight:400; letter-spacing:1px; text-transform:uppercase; }
  .hero-sub{ font-family:var(--font-head); font-weight:700; color:var(--accent-2); }
  @media (min-width:641px){
    :root{ --hero-h:clamp(220px, calc((100vh - 236px) * 0.5), 340px); }
    .hero{ min-height:var(--hero-h); padding:clamp(18px, 3.2vh, 34px) 50px; border-radius:22px; }
    .hero h1{ font-size:clamp(30px, calc(var(--hero-h) * 0.13), 46px); margin:clamp(6px, 1.2vh, 12px) 0 clamp(4px, 1vh, 10px); line-height:1; }
    .hero-sub{ font-size:clamp(15px, calc(var(--hero-h) * 0.06), 20px); }
  }
  @media (max-width:640px){
    .hero{ padding:16px; min-height:211px; margin-left:-12px; margin-right:-12px; }
    .hero::before{ background:linear-gradient(90deg, rgba(1,6,26,0.86) 0%, rgba(1,6,26,0.7) 55%, rgba(1,6,26,0.45) 100%), linear-gradient(180deg, rgba(1,6,26,0.2) 0%, rgba(1,6,26,0.55) 70%, rgba(1,6,26,0.85) 100%), url('assets/hero-forum.jpg') 88% center / auto 125% no-repeat; }
    .hero::after{ display:none; }
    .hero h1{ font-size:28px; margin:6px 0; line-height:1; }
    .hero-eyebrow{ font-size:10px; letter-spacing:1.6px; }
    .hero-sub{ font-size:15px; }
  }

  .f-card{ background:linear-gradient(180deg, rgba(4,9,30,0.88), rgba(4,9,30,0.93)), url('assets/card-bg-sports.jpg') center 40% / cover no-repeat, #081028;
    border:1px solid rgba(96,165,250,0.28); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  @media (max-width:640px){ .f-card{ margin-left:-12px; margin-right:-12px; border-radius:0; border-left:none; border-right:none; padding:16px 14px; } }
  .f-gate{ text-align:center; padding:40px 22px; }
  .f-gate i.big{ font-size:34px; color:var(--accent-2); margin-bottom:12px; display:block; }
  .f-gate h2{ font-family:var(--font-head); font-size:22px; margin-bottom:8px; }
  .f-gate p{ color:var(--text-dim); font-size:14px; max-width:440px; margin:0 auto 18px; line-height:1.55; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:10px 18px; font-family:var(--font-head); font-weight:700; font-size:14.5px; cursor:pointer; border:none; text-decoration:none; }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:#fff; }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-ghost{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.16); color:var(--text); }
  .btn-danger{ background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.55); color:#fca5a5; }
  .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:999px; }

  .crumbs{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text-dim); margin:2px 0 12px; }
  .crumbs a{ color:var(--accent-2); }
  .crumbs i{ font-size:10px; color:var(--text-faint); }

  /* home: one card per tournament, with Live and Past sections */
  .cat-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
  @media (max-width:900px){ .cat-grid{ grid-template-columns:1fr; gap:0; } }
  .cat-card{ margin-bottom:0; }
  @media (max-width:900px){ .cat-card{ margin-bottom:12px; } }
  .cat-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .cat-icon{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg, var(--accent-2), var(--accent-dim)); color:#fff; font-size:18px; flex:none; box-shadow:0 0 16px var(--accent-glow); }
  .cat-name{ font-family:var(--font-head); font-size:20px; font-weight:700; line-height:1.1; }
  .cat-desc{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .sec-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background:rgba(13,23,48,0.85); border:1px solid rgba(96,165,250,0.16); margin-top:8px; transition:border-color .15s, background .15s; }
  .sec-row:hover{ border-color:rgba(96,165,250,0.55); background:rgba(16,28,60,0.9); }
  .sec-badge{ font-family:var(--font-head); font-weight:700; font-size:12px; letter-spacing:.5px; text-transform:uppercase; padding:4px 10px; border-radius:999px; flex:none; min-width:58px; text-align:center; }
  .sec-badge.live{ background:#16a34a; color:#fff; }
  .sec-badge.past{ background:rgba(255,255,255,0.12); color:#cbd5e1; }
  .sec-info{ flex:1; min-width:0; }
  .sec-title{ font-weight:600; font-size:14px; }
  .sec-meta{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .sec-count{ text-align:right; flex:none; font-family:var(--font-head); font-weight:700; font-size:18px; }
  .sec-count small{ display:block; font-family:var(--font-body); font-size:11px; font-weight:500; color:var(--text-faint); }
  .chev{ color:var(--text-faint); font-size:12px; }

  /* thread list */
  .list-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .list-head h2{ font-family:var(--font-head); font-size:20px; display:flex; align-items:center; gap:10px; }
  .th-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background:rgba(13,23,48,0.85); border:1px solid rgba(96,165,250,0.14); margin-top:8px; }
  .th-row:hover{ border-color:rgba(96,165,250,0.5); }
  .th-main{ flex:1; min-width:0; }
  .th-title{ font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .th-meta{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .th-tag{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; margin-right:6px; text-transform:uppercase; letter-spacing:.3px; }
  .th-tag.pin{ background:rgba(242,185,61,0.18); color:var(--gold); }
  .th-tag.lock{ background:rgba(239,68,68,0.15); color:#fca5a5; }
  .th-replies{ text-align:center; flex:none; font-family:var(--font-head); font-weight:700; font-size:18px; min-width:52px; }
  .th-replies small{ display:block; font-family:var(--font-body); font-size:10.5px; color:var(--text-faint); font-weight:500; }
  .empty{ text-align:center; color:var(--text-dim); padding:26px 10px; font-size:14px; }

  /* avatars */
  .av{ position:relative; overflow:hidden; flex:none; width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(150deg,#2c3d5c,#161f33); border:1px solid rgba(255,255,255,0.16); font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--accent-2); }
  .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* thread view */
  .thread-title{ font-family:var(--font-head); font-size:24px; font-weight:700; line-height:1.2; margin-bottom:6px; word-break:break-word; }
  .mod-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .post{ display:flex; gap:12px; padding:14px 0; border-top:1px solid rgba(255,255,255,0.07); }
  .post:first-of-type{ border-top:none; }
  .post-body{ flex:1; min-width:0; }
  .post-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--text-dim); margin-bottom:5px; }
  .post-head b{ color:var(--text); font-family:var(--font-head); font-size:15px; }
  .post-head .op{ font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:rgba(96,165,250,0.18); color:var(--accent-2); text-transform:uppercase; }
  .post-text{ font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .post-del{ margin-left:auto; background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; }
  .post-del:hover{ color:#fca5a5; }

  /* forms */
  .f-input, .f-text{ width:100%; background:rgba(13,23,48,0.9); border:1px solid rgba(96,165,250,0.25); border-radius:10px; padding:11px 13px; color:var(--text); font-family:var(--font-body); font-size:14.5px; }
  .f-input:focus, .f-text:focus{ outline:none; border-color:var(--accent-2); }
  .f-text{ min-height:120px; resize:vertical; line-height:1.5; }
  .f-label{ display:block; font-family:var(--font-head); font-weight:700; font-size:14px; margin:12px 0 6px; }
  .f-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; align-items:center; }
  .f-count{ margin-right:auto; font-size:12px; color:var(--text-faint); }
  .locked-note{ text-align:center; color:#fca5a5; font-size:14px; padding:6px; }
  .loading{ text-align:center; color:var(--text-dim); padding:30px; }

  footer{ position:relative; z-index:1; text-align:center; padding:26px; color:var(--text-faint); font-size:13px; }
  </style>
</head>
<body>
  <svg style="display:none">
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z"/><path d="M7 5H4a3 3 0 0 0 3 3"/><path d="M17 5h3a3 3 0 0 1-3 3"/><path d="M12 12v3"/><path d="M9 19h6"/><path d="M10 16h4l1 3H9l1-3z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8z"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c0-3.6 3-6.2 7-6.2s7 2.6 7 6.2"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>

  <div class="bg-glow"></div>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="nav-left">
      <a href="/" class="logo">
        <div class="logo-mark"><svg class="icon" style="stroke:#fff; width:16px; height:16px;"><use href="#i-trophy"/></svg></div>
        <div class="logo-text">GB HUB<span class="sub">CLICK HERE</span></div>
      </a>
      <nav class="nav-links">
        <a href="/">GB Hub</a>
        <a href="/fantasy-leaderboard">Leaderboard</a>
        <a href="/wallet">Wallet</a>
      </nav>
    </div>
    <div class="nav-right">
      <a class="icon-btn wallet-icon-link" href="/wallet" title="Wallet"><svg class="icon"><use href="#i-wallet"/></svg></a>
      <button class="icon-btn bell-btn" title="Notifications"><svg class="icon"><use href="#i-bell"/></svg></button>
      <a class="avatar-btn" id="navAuthBtn" href="/login?redirect=%2Fforum" title="Log in">
        <div class="avatar" id="navAvatar"><svg class="icon" style="width:14px; height:14px; color:var(--text-dim);"><use href="#i-user"/></svg></div>
        <span id="navAuthLabel" style="font-family:var(--font-head); font-size:13px; font-weight:600; color:var(--text-dim);">Log In</span>
      </a>
      <button class="icon-btn menu-toggle" id="mobileMenuBtn" title="Menu"><svg class="icon"><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
  <div class="mobile-nav-drawer" id="mobileNavDrawer">
    <a href="/">GB Hub</a>
    <a href="/wallet">Wallet</a>
  </div>

  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="hero-eyebrow"><span class="dot"></span>Community</div>
        <h1>GB Forum</h1>
        <div class="hero-sub">Talk tactics. Share picks. Celebrate wins.</div>
      </div>
    </section>

    <div id="forumApp"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
  </main>

  <footer>&copy; 2026 GB Tournaments. Be kind, keep it about the game.</footer>

  <script src="live-poll.js"></script>
  <script src="toast.js"></script>
  <script>
    // Login state for the navbar avatar — same pattern used on the Hub,
    // now that this page shares the same login/localStorage (same site).
    (function () {
      const token = localStorage.getItem('gbf_token');
      const userJson = localStorage.getItem('gbf_user');
      const btn = document.getElementById('navAuthBtn');
      const label = document.getElementById('navAuthLabel');
      const avatar = document.getElementById('navAvatar');
      if (!btn || !token || !userJson) return;
      try {
        const user = JSON.parse(userJson);
        const name = user.display_name || user.username || 'Account';
        label.textContent = name;
        label.style.display = 'inline';
        avatar.textContent = name.substring(0, 2).toUpperCase();
        avatar.style.cssText += 'display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--accent-2);';
        btn.classList.add('logged-in');
        btn.href = '/profile';
        btn.title = 'View profile';
      } catch (e) {}
    })();

    function toggleMobileNav(open) {
      document.getElementById('mobileNavDrawer').classList.toggle('open', open);
      document.getElementById('mobileNavOverlay').classList.toggle('open', open);
    }
    document.getElementById('mobileMenuBtn').addEventListener('click', () => toggleMobileNav(true));
    document.getElementById('mobileNavOverlay').addEventListener('click', () => toggleMobileNav(false));

  </script>
  <script>
  // ===================== GB Forum =====================
  // Logged-in users only. Pages (all on /forum):
  //   #/            every tournament, each with Live and Past sections
  //   #/c/<slug>    threads in one section
  //   #/t/<id>      one thread with its replies
  (function () {
    const app = document.getElementById('forumApp');
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const token = () => localStorage.getItem('gbf_token');
    const toast = (m, t) => { if (typeof showToast === 'function') showToast(m, t); else alert(m); };
    let cache = { categories: null };

    async function api(body) {
      const r = await fetch('/api/tournaments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await r.json(); } catch (e) {}
      if (r.status === 401) { showExpired(); throw new Error('expired'); }
      if (!r.ok) throw new Error(data.error || 'Something went wrong');
      return data;
    }

    function ago(iso) {
      if (!iso) return '';
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      if (s < 604800) return Math.floor(s / 86400) + 'd ago';
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function avatar(name, url) {
      const ini = String(name || '?').trim().substring(0, 2).toUpperCase();
      const ok = typeof url === 'string' && /^https:\/\//i.test(url);
      return `<span class="av">${esc(ini)}${ok ? `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
    }

    function showLogin() {
      app.innerHTML = `<div class="f-card f-gate"><i class="fas fa-comments big"></i>
        <h2>Log in to join the conversation</h2>
        <p>The GB Forum is for members only. Log in or create a free account to read and post.</p>
        <a class="btn btn-primary" href="/login?redirect=%2Fforum"><i class="fas fa-right-to-bracket"></i> Log In</a>
        <a class="btn btn-ghost" href="/register" style="margin-left:8px;"><i class="fas fa-user-plus"></i> Create Account</a></div>`;
    }
    function showExpired() {
      app.innerHTML = `<div class="f-card f-gate"><i class="fas fa-triangle-exclamation big" style="color:#ef4444;"></i>
        <h2>Your session has expired</h2><p>Log back in to carry on — nothing you posted has been lost.</p>
        <a class="btn btn-primary" href="/login?redirect=%2Fforum"><i class="fas fa-right-to-bracket"></i> Log In Again</a></div>`;
    }
    function showError(msg) {
      app.innerHTML = `<div class="f-card f-gate"><i class="fas fa-circle-exclamation big"></i><h2>Couldn't load the forum</h2><p>${esc(msg)}</p>
        <a class="btn btn-ghost" href="#/" onclick="location.reload();return false;"><i class="fas fa-rotate"></i> Try again</a></div>`;
    }

    // ---------- Home: every tournament with Live / Past ----------
    async function renderHome() {
      app.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
      const data = await api({ action: 'forum_get_categories' });
      cache.categories = data.categories || [];
      const parents = cache.categories.filter(c => !c.parent_id).sort((a, b) => a.sort_order - b.sort_order);
      app.innerHTML = `<div class="cat-grid">${parents.map(p => {
        const subs = cache.categories.filter(c => c.parent_id === p.id).sort((a, b) => a.sort_order - b.sort_order);
        return `<section class="f-card cat-card">
          <div class="cat-head"><span class="cat-icon"><i class="fas ${esc(p.icon || 'fa-comments')}"></i></span>
            <div><div class="cat-name">${esc(p.name)}</div><div class="cat-desc">${esc(p.description || '')}</div></div></div>
          ${subs.map(s => {
            const kind = /-live$/.test(s.slug) ? 'live' : 'past';
            return `<a class="sec-row" href="#/c/${esc(s.slug)}">
              <span class="sec-badge ${kind}">${esc(s.name)}</span>
              <span class="sec-info"><div class="sec-title">${esc(s.description || '')}</div>
                <div class="sec-meta">${s.last_activity_at ? 'Last post ' + ago(s.last_activity_at) : 'No posts yet — start one'}</div></span>
              <span class="sec-count">${s.thread_count || 0}<small>${(s.thread_count || 0) === 1 ? 'thread' : 'threads'}</small></span>
              <i class="fas fa-chevron-right chev"></i></a>`;
          }).join('')}
        </section>`;
      }).join('')}</div>`;
    }

    // ---------- Section: thread list ----------
    async function renderSection(slug) {
      app.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
      const data = await api({ action: 'forum_get_threads', category_slug: slug });
      const c = data.category, p = data.parent;
      const title = p ? `${p.name} · ${c.name}` : c.name;
      app.innerHTML = `
        <div class="crumbs"><a href="#/">Forum</a><i class="fas fa-chevron-right"></i>${p ? esc(p.name) + '<i class="fas fa-chevron-right"></i>' : ''}<span>${esc(c.name)}</span></div>
        <section class="f-card">
          <div class="list-head"><h2>${p ? `<span class="sec-badge ${/-live$/.test(c.slug) ? 'live' : 'past'}">${esc(c.name)}</span>` : ''} ${esc(p ? p.name : c.name)}</h2>
            <button class="btn btn-primary btn-sm" id="newThreadBtn"><i class="fas fa-plus"></i> New Thread</button></div>
          <div id="newThreadForm" style="display:none;">
            <label class="f-label" for="ntTitle">Title</label>
            <input class="f-input" id="ntTitle" maxlength="200" placeholder="What's it about?">
            <label class="f-label" for="ntBody">Message</label>
            <textarea class="f-text" id="ntBody" maxlength="5000" placeholder="Say something…"></textarea>
            <div class="f-actions"><span class="f-count" id="ntCount">0 / 5000</span>
              <button class="btn btn-ghost btn-sm" id="ntCancel">Cancel</button>
              <button class="btn btn-primary btn-sm" id="ntPost"><i class="fas fa-paper-plane"></i> Post Thread</button></div>
          </div>
          <div id="threadList">${(data.threads || []).length ? data.threads.map(t => `
            <a class="th-row" href="#/t/${esc(t.id)}">
              ${avatar(t.author_name, t.author_avatar)}
              <span class="th-main"><div class="th-title">${t.pinned ? '<span class="th-tag pin"><i class="fas fa-thumbtack"></i> Pinned</span>' : ''}${t.locked ? '<span class="th-tag lock"><i class="fas fa-lock"></i> Locked</span>' : ''}${esc(t.title)}</div>
                <div class="th-meta">by ${esc(t.author_name)} · ${ago(t.created_at)}${t.reply_count ? ' · last reply ' + ago(t.last_reply_at) : ''}</div></span>
              <span class="th-replies">${t.reply_count || 0}<small>${(t.reply_count || 0) === 1 ? 'reply' : 'replies'}</small></span>
            </a>`).join('') : '<div class="empty">No threads here yet. Be the first to start one!</div>'}</div>
        </section>`;
      document.title = `${title} - Forum - GB Tournaments`;
      const form = document.getElementById('newThreadForm');
      const body = document.getElementById('ntBody');
      document.getElementById('newThreadBtn').onclick = () => { form.style.display = form.style.display === 'none' ? 'block' : 'none'; if (form.style.display === 'block') document.getElementById('ntTitle').focus(); };
      document.getElementById('ntCancel').onclick = () => { form.style.display = 'none'; };
      body.oninput = () => { document.getElementById('ntCount').textContent = `${body.value.length} / 5000`; };
      document.getElementById('ntPost').onclick = async (e) => {
        const btn = e.currentTarget;
        const ttl = document.getElementById('ntTitle').value.trim();
        const txt = body.value.trim();
        if (!ttl || !txt) { toast('Add a title and a message first.', 'error'); return; }
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting…';
        try {
          const r = await api({ action: 'forum_create_thread', category_id: c.id, title: ttl, content: txt });
          location.hash = `#/t/${r.thread_id}`;
        } catch (err) {
          if (err.message !== 'expired') toast(err.message, 'error');
          btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post Thread';
        }
      };
    }

    // ---------- Thread ----------
    async function renderThread(id) {
      app.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
      const data = await api({ action: 'forum_get_thread', thread_id: id });
      const t = data.thread, c = data.category, p = data.parent, me = data.me || {};
      const posts = data.posts || [];
      app.innerHTML = `
        <div class="crumbs"><a href="#/">Forum</a><i class="fas fa-chevron-right"></i>${p ? esc(p.name) + '<i class="fas fa-chevron-right"></i>' : ''}${c ? `<a href="#/c/${esc(c.slug)}">${esc(c.name)}</a>` : ''}</div>
        <section class="f-card">
          <div class="thread-title">${t.pinned ? '<span class="th-tag pin"><i class="fas fa-thumbtack"></i> Pinned</span>' : ''}${t.locked ? '<span class="th-tag lock"><i class="fas fa-lock"></i> Locked</span>' : ''}${esc(t.title)}</div>
          <div class="th-meta">Started by ${esc(t.author_name)} · ${ago(t.created_at)} · ${t.reply_count || 0} ${(t.reply_count || 0) === 1 ? 'reply' : 'replies'}</div>
          ${me.is_admin ? `<div class="mod-bar">
            <button class="btn btn-ghost btn-sm" data-mod="pin"><i class="fas fa-thumbtack"></i> ${t.pinned ? 'Unpin' : 'Pin'}</button>
            <button class="btn btn-ghost btn-sm" data-mod="lock"><i class="fas fa-lock"></i> ${t.locked ? 'Unlock' : 'Lock'}</button>
            <button class="btn btn-danger btn-sm" data-mod="delete"><i class="fas fa-trash"></i> Delete thread</button></div>` : ''}
        </section>
        <section class="f-card">
          ${posts.map((po, i) => `<div class="post">
            ${avatar(po.author_name, po.author_avatar)}
            <div class="post-body"><div class="post-head"><b>${esc(po.author_name)}</b>${po.user_id === t.user_id ? '<span class="op">Starter</span>' : ''}<span>${ago(po.created_at)}</span>
              ${(po.user_id === me.id || me.is_admin) ? `<button class="post-del" data-del="${esc(po.id)}" data-first="${i === 0 ? 1 : 0}" title="Delete"><i class="fas fa-trash"></i> Delete</button>` : ''}</div>
              <div class="post-text">${esc(po.content)}</div></div></div>`).join('')}
        </section>
        <section class="f-card">
          ${t.locked ? '<div class="locked-note"><i class="fas fa-lock"></i> This thread is locked — no new replies.</div>' : `
            <label class="f-label" for="replyBody" style="margin-top:0;">Reply</label>
            <textarea class="f-text" id="replyBody" maxlength="5000" placeholder="Write a reply…"></textarea>
            <div class="f-actions"><span class="f-count" id="rpCount">0 / 5000</span>
              <button class="btn btn-primary btn-sm" id="replyBtn"><i class="fas fa-reply"></i> Post Reply</button></div>`}
        </section>`;
      document.title = `${t.title} - Forum - GB Tournaments`;

      const rb = document.getElementById('replyBody');
      if (rb) {
        rb.oninput = () => { document.getElementById('rpCount').textContent = `${rb.value.length} / 5000`; };
        document.getElementById('replyBtn').onclick = async (e) => {
          const btn = e.currentTarget; const txt = rb.value.trim();
          if (!txt) { toast('Write something first.', 'error'); return; }
          btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting…';
          try { await api({ action: 'forum_create_reply', thread_id: id, content: txt }); await renderThread(id); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
          catch (err) { if (err.message !== 'expired') toast(err.message, 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-reply"></i> Post Reply'; }
        };
      }
      app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const first = b.dataset.first === '1';
        if (!confirm(first ? 'This is the opening post — deleting it deletes the whole thread. Continue?' : 'Delete this post?')) return;
        try {
          const r = await api({ action: 'forum_delete_post', post_id: b.dataset.del });
          if (r.thread_deleted) { toast('Thread deleted.', 'success'); location.hash = c ? `#/c/${c.slug}` : '#/'; }
          else { toast('Post deleted.', 'success'); renderThread(id); }
        } catch (err) { if (err.message !== 'expired') toast(err.message, 'error'); }
      });
      app.querySelectorAll('[data-mod]').forEach(b => b.onclick = async () => {
        const m = b.dataset.mod;
        if (m === 'delete' && !confirm('Delete this whole thread and all its replies?')) return;
        const body = { action: 'forum_admin_moderate_thread', thread_id: id };
        if (m === 'pin') body.pinned = !t.pinned;
        if (m === 'lock') body.locked = !t.locked;
        if (m === 'delete') body.delete = true;
        try {
          await api(body);
          if (m === 'delete') { toast('Thread deleted.', 'success'); location.hash = c ? `#/c/${c.slug}` : '#/'; }
          else renderThread(id);
        } catch (err) { if (err.message !== 'expired') toast(err.message, 'error'); }
      });
    }

    async function route() {
      if (!token()) { showLogin(); return; }
      const h = location.hash || '#/';
      try {
        let m;
        if ((m = h.match(/^#\/c\/([a-z0-9-]+)$/))) await renderSection(m[1]);
        else if ((m = h.match(/^#\/t\/([0-9a-f-]{36})$/))) await renderThread(m[1]);
        else { document.title = 'Forum - GB Tournaments'; await renderHome(); }
      } catch (err) {
        if (err.message !== 'expired') showError(err.message);
      }
    }
    window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
    route();
  })();
  </script>
  <script src="notifications.js"></script>
</body>
</html>
