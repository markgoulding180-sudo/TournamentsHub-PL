<script>
// Set active sidebar link based on current page
(function() {
  const path = window.location.pathname;
  const page = path.split('/').pop().replace('.html', '') || 'index';
  const link = document.querySelector(`.sidebar-link[data-page="${page}"]`);
  if (link) link.classList.add('active');
  
  // Update user info if logged in
  const userJson = localStorage.getItem('gbf_user');
  if (userJson) {
    try {
      const user = JSON.parse(userJson);
      document.getElementById('sidebar-username').textContent = user.display_name || user.username;
      document.getElementById('sidebar-avatar').textContent = (user.display_name || user.username).substring(0, 2).toUpperCase();
    } catch (e) {}
  }
})();
</script>
