<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gameweek History - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg:#060b1e; --bg-panel:#0a1226; --bg-card:#0d1730;
      --border:#131f35;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth; overflow-x:hidden;}
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    a{color:inherit;text-decoration:none;}
    .bg-glow{ position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%); pointer-events:none; z-index:0; }

    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .back-link{ display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text-dim); }
    .back-link:hover{ color:var(--text); }

    .wrap{ max-width:680px; margin:0 auto; padding:36px 20px 60px; position:relative; z-index:1; }

    .header-card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:28px 24px; text-align:center; margin-bottom:16px; }
    .header-card .name{ font-family:var(--font-head); font-size:24px; font-weight:700; margin-bottom:6px; }
    .header-card .sub{ color:var(--text-dim); font-size:13px; margin-bottom:16px; }
    .header-card .total{ font-family:var(--font-display); font-size:40px; color:var(--accent-2); line-height:1; }
    .header-card .total-label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

    .stats-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
    .stat-card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
    .stat-card .stat-label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
    .stat-card .stat-value{ font-family:var(--font-display); font-size:22px; }
    .stat-card.best .stat-value{ color:var(--gold); }
    .stat-card.worst .stat-value{ color:var(--red); }
    .stat-card .stat-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; }

    .card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 20px; margin-bottom:16px; }
    .card-title{ font-family:var(--font-head); font-weight:700; font-size:15px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }

    /* Progression bar chart - same reasoning as Fantasy's history page:
       a bar per gameweek makes good and bad weeks obvious at a glance. */
    .gw-row{ margin-bottom:10px; }
    .gw-row-main{ display:flex; align-items:center; gap:12px; cursor:pointer; }
    .gw-label{ flex:none; width:44px; font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--text-dim); }
    .gw-bar-track{ flex:1 1 auto; background:var(--bg-card); border-radius:6px; height:26px; position:relative; overflow:hidden; }
    .gw-bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent-2)); border-radius:6px; transition:width .4s ease; }
    .gw-bar-fill.best{ background:linear-gradient(90deg, #b8860b, var(--gold)); }
    .gw-bar-fill.worst{ background:linear-gradient(90deg, #7f1d1d, var(--red)); }
    .gw-points{ flex:none; width:60px; text-align:right; font-family:var(--font-head); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:flex-end; gap:6px; }
    .gw-chevron{ font-size:11px; color:var(--text-faint); transition:transform .2s; }
    .gw-row.open .gw-chevron{ transform:rotate(180deg); }

    .gw-detail{ display:none; margin:10px 0 4px 56px; padding:10px 12px; background:var(--bg-card); border-radius:8px; border:1px solid var(--border); }
    .gw-row.open .gw-detail{ display:block; }
    .pick-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
    .pick-row:last-child{ border-bottom:none; }
    .pick-match{ flex:1 1 auto; min-width:0; }
    .pick-match .teams{ font-weight:600; }
    .pick-match .your-pick{ font-size:11px; color:var(--text-dim); margin-top:1px; }
    .pick-result{ flex:none; font-size:11px; color:var(--text-faint); text-align:right; width:64px; }
    .pick-pts{ flex:none; width:34px; text-align:right; font-weight:700; }
    .pick-pts.zero{ color:var(--text-faint); }
    .pick-pts.some{ color:var(--green); }

    .trend-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .trend-row:last-child{ border-bottom:none; }
    .trend-rank{ flex:none; width:20px; color:var(--text-faint); font-weight:700; font-family:var(--font-head); }
    .trend-team{ flex:1 1 auto; font-weight:600; }
    .trend-count{ flex:none; color:var(--accent-2); font-weight:700; }

    .empty{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:14px; }
    .loading{ text-align:center; padding:40px 20px; color:var(--text-dim); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <nav class="navbar">
    <div class="logo">
      <div class="logo-mark"><i class="fas fa-futbol" style="color:#fff;"></i></div>
      <div class="logo-text">GB TOURNAMENTS<span class="sub">PREDICTIONS</span></div>
    </div>
    <a href="/leaderboard" class="back-link"><i class="fas fa-arrow-left"></i> Leaderboard</a>
  </nav>

  <div class="wrap">
    <div id="content">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading gameweek history…</div>
    </div>
  </div>

  <script>
    async function load() {
      const content = document.getElementById('content');
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('user_id');
      if (!userId) {
        content.innerHTML = '<div class="empty">No player selected. Go back to the leaderboard and click a name.</div>';
        return;
      }
      try {
        const res = await fetch(`/api/tournaments?predictions_user_history=true&user_id=${userId}`);
        if (!res.ok) {
          content.innerHTML = '<div class="empty">Couldn\'t find that player.</div>';
          return;
        }
        const data = await res.json();
        const gameweeks = data.gameweeks || [];

        const headerHtml = `
          <div class="header-card">
            <div class="name">${escapeHtml(data.player_name)}</div>
            <div class="sub">Gameweek-by-gameweek history</div>
            <div class="total">${data.total_points || 0}</div>
            <div class="total-label">Total Points</div>
          </div>`;

        if (gameweeks.length === 0) {
          content.innerHTML = headerHtml + '<div class="card"><div class="empty">No predictions made yet.</div></div>';
          return;
        }

        const statsHtml = `
          <div class="stats-row">
            <div class="stat-card best">
              <div class="stat-label">Best Gameweek</div>
              <div class="stat-value">${data.best_gameweek ? 'GW' + data.best_gameweek.gameweek : '—'}</div>
              <div class="stat-sub">${data.best_gameweek ? data.best_gameweek.points + ' pts' : 'Not enough data yet'}</div>
            </div>
            <div class="stat-card worst">
              <div class="stat-label">Worst Gameweek</div>
              <div class="stat-value">${data.worst_gameweek ? 'GW' + data.worst_gameweek.gameweek : '—'}</div>
              <div class="stat-sub">${data.worst_gameweek ? data.worst_gameweek.points + ' pts' : 'Not enough data yet'}</div>
            </div>
          </div>`;

        const scoredGws = gameweeks.filter(g => g.picks.some(p => p.points_earned !== null && p.points_earned !== undefined));
        const maxPoints = Math.max(...scoredGws.map(g => g.total), 1);
        const bestGwNum = data.best_gameweek ? data.best_gameweek.gameweek : null;
        const worstGwNum = data.worst_gameweek ? data.worst_gameweek.gameweek : null;

        const rowsHtml = gameweeks.map((g, idx) => {
          const isScored = g.picks.some(p => p.points_earned !== null && p.points_earned !== undefined);
          const pct = isScored ? Math.max(4, Math.round((g.total / maxPoints) * 100)) : 3;
          const barClass = g.gameweek === bestGwNum && bestGwNum !== worstGwNum ? 'best' : (g.gameweek === worstGwNum && bestGwNum !== worstGwNum ? 'worst' : '');

          const picksHtml = g.picks.map(p => {
            const scored = p.points_earned !== null && p.points_earned !== undefined;
            const resultText = (p.home_score !== null && p.home_score !== undefined) ? `${p.home_score}-${p.away_score}` : 'Upcoming';
            const pickText = p.predicted_result === 'H' ? p.home_team : (p.predicted_result === 'A' ? p.away_team : 'Draw');
            return `
              <div class="pick-row">
                <div class="pick-match">
                  <div class="teams">${escapeHtml(p.home_team)} v ${escapeHtml(p.away_team)}</div>
                  <div class="your-pick">Your pick: ${escapeHtml(pickText)}</div>
                </div>
                <div class="pick-result">${resultText}</div>
                <div class="pick-pts ${!scored ? '' : (p.points_earned > 0 ? 'some' : 'zero')}">${scored ? p.points_earned : '—'}</div>
              </div>`;
          }).join('');

          return `
            <div class="gw-row" id="predGwRow${idx}">
              <div class="gw-row-main" onclick="document.getElementById('predGwRow${idx}').classList.toggle('open')">
                <div class="gw-label">GW${g.gameweek}</div>
                <div class="gw-bar-track"><div class="gw-bar-fill ${barClass}" style="width:${pct}%;"></div></div>
                <div class="gw-points">${isScored ? g.total + ' pts' : 'Pending'} <i class="fas fa-chevron-down gw-chevron"></i></div>
              </div>
              <div class="gw-detail">${picksHtml}</div>
            </div>`;
        }).join('');

        const trending = data.trending_teams || [];
        const trendingHtml = trending.length === 0
          ? `<div class="empty" style="padding:16px 0;">No picks yet.</div>`
          : trending.map((t, i) => `
              <div class="trend-row">
                <div class="trend-rank">${i + 1}</div>
                <div class="trend-team">${escapeHtml(t.team)}</div>
                <div class="trend-count">${t.count}x</div>
              </div>`).join('');

        content.innerHTML = headerHtml + statsHtml + `
          <div class="card">
            <div class="card-title"><i class="fas fa-chart-simple" style="color:var(--accent-2);"></i> Points By Gameweek</div>
            <div style="font-size:11.5px; color:var(--text-faint); margin:-10px 0 16px;">Tap a gameweek to see every pick and result</div>
            ${rowsHtml}
          </div>
          <div class="card">
            <div class="card-title"><i class="fas fa-fire" style="color:var(--gold);"></i> Most Picked Teams</div>
            ${trendingHtml}
          </div>`;
      } catch (e) {
        console.error('Failed to load prediction history:', e);
        content.innerHTML = '<div class="empty">Something went wrong loading this player\'s history.</div>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    load();
  </script>
</body>
</html>
