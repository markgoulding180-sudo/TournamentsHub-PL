<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Leaderboard - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root{
      --bg:#040812; --bg-panel:#070d1a; --bg-card:#0a101f;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .bg-glow{ position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%); pointer-events:none; z-index:0; }

    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-left{display:flex;align-items:center;gap:40px;}
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .nav-links{display:flex; gap:30px;}
    .nav-links a{ font-family:var(--font-head); font-size:14px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); padding-bottom:19px; position:relative; transition:color .2s; }
    .nav-links a:hover{color:var(--text);}
    .nav-links a.active{color:var(--text);}
    .nav-links a.active::after{ content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--accent-2); box-shadow:0 0 10px var(--accent-glow); border-radius:2px; }
    .nav-right{display:flex;align-items:center;gap:14px;}
    .avatar-btn{display:flex;align-items:center;gap:6px; padding:4px; border-radius:22px; border:1px solid transparent; transition:border-color .2s;}
    .avatar-btn:hover{border-color:var(--border);}
    .avatar{ width:36px;height:36px;border-radius:50%; background:linear-gradient(150deg,#2c3d5c,#161f33); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; }

    main{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:32px 24px 60px; }
    .header{ margin-bottom:22px; }
    .header h1{ font-family:var(--font-display); font-size:26px; letter-spacing:.4px; margin-bottom:6px; }
    .header p{ color:var(--text-dim); font-size:14px; }

    .board{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .board-head{ display:flex; align-items:center; gap:14px; padding:14px 22px; background:var(--bg-card); border-bottom:1px solid var(--border); font-family:var(--font-head); font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); }
    .col-rank{ width:40px; }
    .col-name{ flex:1; }
    .col-points{ width:90px; text-align:right; }

    .row{ display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--border); }
    .row:last-child{ border-bottom:none; }
    .row:hover{ background:var(--bg-card); }
    .rank{ width:40px; font-family:var(--font-head); font-weight:700; font-size:16px; color:var(--text-faint); }
    .rank.top1{ color:var(--gold); }
    .rank.top2{ color:#c7cdd6; }
    .rank.top3{ color:#c98a4b; }
    .name{ flex:1; font-size:15px; }
    .points-col{ width:90px; text-align:right; }
    .points-col .total{ font-family:var(--font-head); font-weight:700; font-size:16px; color:var(--gold); display:block; }
    .points-col .gw{ font-size:11.5px; color:var(--text-faint); }

    .loading, .empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
    footer{ position:relative; z-index:1; text-align:center; padding:26px; color:var(--text-faint); font-size:13px; border-top:1px solid var(--border); margin-top:20px; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="navbar">
    <div class="nav-left">
      <a href="/" class="logo">
        <div class="logo-mark"><i class="fas fa-trophy" style="color:#fff;font-size:16px;"></i></div>
        <div class="logo-text">GB TOURNAMENTS<span class="sub">COMPETE · PREDICT · WIN</span></div>
      </a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/tournaments">Predictions</a>
        <a href="/fantasy-manager">Fantasy Manager</a>
        <a href="/fantasy-leaderboard" class="active">Fantasy Leaderboard</a>
      </nav>
    </div>
    <div class="nav-right">
      <a class="avatar-btn" id="navAuthBtn" href="/login?redirect=%2Ffantasy-leaderboard" title="Log in">
        <div class="avatar" id="navAvatar"><i class="fas fa-user" style="font-size:14px;color:var(--text-dim);"></i></div>
        <span id="navAuthLabel" style="font-family:var(--font-head); font-size:13px; font-weight:600; color:var(--text-dim); display:none;">Log In</span>
      </a>
    </div>
  </header>

  <main>
    <div class="header">
      <h1><i class="fas fa-chart-line" style="color:var(--gold);"></i> Fantasy Manager Leaderboard</h1>
      <p>Ranked by season total points. Captain's points are doubled.</p>
    </div>

    <div class="board">
      <div class="board-head">
        <div class="col-rank">#</div>
        <div class="col-name">Player</div>
        <div class="col-points">Points</div>
      </div>
      <div id="boardBody">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading leaderboard…</div>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 GB Tournaments. Predict responsibly.</footer>

  <script src="live-poll.js"></script>
  <script>
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadBoard() {
      const body = document.getElementById('boardBody');
      try {
        const tRes = await fetch('/api/tournaments?status=live&tournament_type=fantasy');
        const tData = await tRes.json();
        const tournament = (tData.tournaments || []).find(t => t.format === 'fantasy_squad');
        if (!tournament) {
          body.innerHTML = '<div class="empty">Fantasy Manager tournament not set up yet.</div>';
          return;
        }

        const res = await fetch(`/api/tournaments?tournament_id=${tournament.id}&leaderboard=true&tournament_type=fantasy`);
        const data = await res.json();
        const rows = data.leaderboard || [];

        if (rows.length === 0) {
          body.innerHTML = '<div class="empty">No squads saved yet — be the first!</div>';
          return;
        }

        body.innerHTML = rows.map(r => {
          const rankClass = r.rank === 1 ? 'top1' : r.rank === 2 ? 'top2' : r.rank === 3 ? 'top3' : '';
          const name = r.users ? (r.users.display_name || r.users.username) : 'Player';
          return `
            <div class="row">
              <div class="rank ${rankClass}">${r.rank}</div>
              <div class="name">${escapeHtml(name)}</div>
              <div class="points-col">
                <span class="total">${r.entry_points || 0}</span>
                <span class="gw">${r.gw_points || 0} this GW</span>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        console.error('Failed to load leaderboard:', e);
        body.innerHTML = '<div class="empty">Couldn\'t load the leaderboard right now.</div>';
      }
    }

    function initAuthButton() {
      const token = localStorage.getItem('gbf_token');
      const userJson = localStorage.getItem('gbf_user');
      const btn = document.getElementById('navAuthBtn');
      const label = document.getElementById('navAuthLabel');
      const avatar = document.getElementById('navAvatar');
      if (!btn || !token || !userJson) return;
      try {
        const user = JSON.parse(userJson);
        const name = user.display_name || user.username || 'Account';
        label.textContent = name;
        label.style.display = 'inline';
        avatar.textContent = name.substring(0, 2).toUpperCase();
        avatar.style.cssText += 'display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--accent-2);';
        btn.href = '/profile';
        btn.title = 'View profile';
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAuthButton();
      loadBoard();
    });
    window.addEventListener('gbf-data-refreshed', loadBoard);
  </script>
</body>
</html>
