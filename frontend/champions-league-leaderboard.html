<!DOCTYPE html>
<html lang="en" data-gbs="cl-leaderboard">
<head>
  <meta charset="UTF-8">
  <script src="/gb-domain.js"></script>
  <link rel="stylesheet" href="/gb-shell.css">
  <script src="/gb-shell.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions League Leaderboard - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg:#060b1e; --bg-panel:#0a1226; --bg-card:#0d1730; --bg-card-2:#101a38;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#f1f5fc; --text-faint:#d5dceb;
      --gold:#f2b93d; --silver:#c7cedb; --bronze:#d08a4f; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth; overflow-x:hidden;}
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .bg-glow{ position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%); pointer-events:none; z-index:0; }

    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-left{display:flex;align-items:center;gap:40px;}
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .nav-links{display:flex; gap:30px;}
    .nav-links a{ font-family:var(--font-head); font-size:14px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); }
    .nav-links a:hover{color:var(--text);}
    .nav-right{display:flex;align-items:center;gap:14px;}
    .icon-btn{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--bg-card); border:1px solid var(--border); text-decoration:none; }
    /* Matches the hub's SVG icon styling exactly - stroke-based line
       icons, not filled shapes, so they render identically everywhere. */
    .icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;color:var(--text-dim);}
    .icon-btn i{font-size:15px;color:var(--text-dim);}
    .avatar-btn{display:flex;align-items:center;gap:6px; padding:4px; border-radius:22px; border:1px solid transparent; transition:border-color .2s;}
    .avatar-btn:hover{border-color:var(--border);}
    .avatar{ width:36px;height:36px;border-radius:50%; background:linear-gradient(150deg,#2c3d5c,#161f33); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; }

    main{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:32px 24px 70px; }

    /* ============ HERO ============ */
    .lb-hero{ text-align:center; margin-bottom:28px; }
    .lb-hero-icon{
      width:64px; height:64px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle, rgba(242,185,61,0.16) 0%, transparent 72%); border:1.5px dashed rgba(242,185,61,0.4);
    }
    .lb-hero-icon i{ font-size:26px; color:var(--gold); filter:drop-shadow(0 0 12px rgba(242,185,61,0.45)); }
    .lb-hero h1{ font-family:var(--font-display); font-size:clamp(30px,5vw,40px); font-weight:400; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
    .lb-hero p{ color:var(--text-dim); font-size:14px; }

    /* ============ LIST ============ */
    .lb-card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .lb-row{ display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--border); }
    .lb-row:last-child{ border-bottom:none; }
    .lb-row.top1{ background:linear-gradient(90deg, rgba(242,185,61,0.08), transparent); }
    .lb-row.top2{ background:linear-gradient(90deg, rgba(199,206,219,0.06), transparent); }
    .lb-row.top3{ background:linear-gradient(90deg, rgba(208,138,79,0.07), transparent); }

    .lb-rank{ flex-shrink:0; width:30px; text-align:center; font-family:var(--font-display); font-size:17px; color:var(--text-faint); }
    .lb-rank.top1{ color:var(--gold); }
    .lb-rank.top2{ color:var(--silver); }
    .lb-rank.top3{ color:var(--bronze); }

    .lb-avatar{
      flex-shrink:0; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      background:var(--bg-card); border:1px solid var(--border); font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--accent-2);
    }
    .lb-row.top1 .lb-avatar{ border-color:var(--gold); color:var(--gold); }
    .lb-row.top2 .lb-avatar{ border-color:var(--silver); color:var(--silver); }
    .lb-row.top3 .lb-avatar{ border-color:var(--bronze); color:var(--bronze); }

    .lb-name{ flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lb-points{ flex-shrink:0; font-family:var(--font-display); font-size:19px; color:var(--text); }
    .lb-points .unit{ font-family:var(--font-body); font-size:11px; font-weight:600; color:var(--text-faint); margin-left:4px; text-transform:uppercase; }

    .empty, .loading{ text-align:center; color:var(--text-dim); padding:40px 20px; font-size:14px; }
    .empty i{ display:block; font-size:26px; color:var(--text-faint); margin-bottom:10px; }

    /* Mobile hamburger drawer — standard across every page */
    .icon-btn.menu-toggle{ display:none; }
    .mobile-nav-overlay{ display:none; position:fixed; inset:0; z-index:198; background:rgba(0,0,0,0.5); }
    .mobile-nav-overlay.open{ display:block; }
    .mobile-nav-drawer{
      display:none; position:fixed; top:0; right:0; bottom:0; z-index:199; width:78%; max-width:300px;
      background:var(--bg-panel); border-left:1px solid var(--border); padding:80px 24px 24px;
      flex-direction:column; gap:4px; transform:translateX(100%); transition:transform .25s ease;
    }
    .mobile-nav-drawer.open{ display:flex; transform:translateX(0); }
    .mobile-nav-drawer a{ padding:12px 10px; border-radius:10px; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text-dim); }
    .mobile-nav-drawer a:hover{ background:var(--bg-card); color:var(--text); }

    @media (max-width:640px){
      .navbar{ padding:12px 16px; }
      .logo-text{ font-size:14px; }
      .logo-text .sub{ font-size:9px; letter-spacing:2px; }
      .nav-links{ display:none; }
      .avatar-btn .avatar{ width:34px; height:34px; }
      .icon-btn.menu-toggle{ display:flex; }
      main{ padding:22px 14px 50px; }
    }
  
  /* ---- Profile photos on leaderboards (photo over initials; if the
     photo can't load it removes itself and the initials show) ---- */
  .gb-av{ position:relative; overflow:hidden; }
  .gb-av-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .gb-av-sm{ flex-shrink:0; width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); font-size:10px; font-weight:700; color:#9fb3d9; line-height:1; vertical-align:middle; }

  /* ===== Top bar — the same on every screen size =====
     Desktop shows exactly what phones show: GB Hub logo, profile photo
     and name, wallet, notifications and the menu button. All the page
     links live in the menu. */
  .navbar .nav-links, .hub-navbar .hub-nav-links,
  .navbar .my-tournaments-btn, .navbar #logoutBtn{ display:none !important; }
  .navbar #mobileMenuBtn, .hub-navbar #mobileMenuBtn{ display:flex !important; }
  @media (min-width:861px){ .navbar > .nav-right{ margin-left:auto; } }
  .navbar .tourney-home-link{ display:flex !important; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); }

    /* ===== Default background (same as the other pages) + the leaderboard box
       darkened so only 20% of the picture shows - same as the Predictions leaderboard ===== */
    body{ background:linear-gradient(180deg, rgba(4,8,22,0.86), rgba(4,8,22,0.93)), url('assets/card-bg-sports.jpg') center top / cover fixed no-repeat, #060b1e; }
    .lb-card{ background:linear-gradient(rgba(4,9,30,0.80), rgba(4,9,30,0.80)), url('assets/card-bg-sports.jpg') center 40% / cover no-repeat, #081028 !important; }
    .lb-card, .lb-card *, .lb-hero h1, .lb-hero p{ text-shadow:0 1px 4px rgba(0,0,0,.85); }

    /* ===== Player picks pop-up (tap a name on the leaderboard) ===== */
    .lb-row.tap{ cursor:pointer; transition:background .15s; }
    .lb-row.tap:hover{ background:rgba(59,130,246,0.08); }
    .lb-row.tap .lb-name::after{ content:'\f054'; font-family:'Font Awesome 6 Free'; font-weight:900; font-size:10px; color:var(--text-faint); margin-left:8px; opacity:.7; }
    .pp-bg{ position:fixed; inset:0; z-index:100000; background:rgba(2,5,14,0.78); backdrop-filter:blur(4px); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
    .pp-bg.open{ display:flex; }
    .pp{ width:100%; max-width:640px; background:#0a1226; border:1px solid #1d2b4a; border-radius:18px; box-shadow:0 24px 70px rgba(0,0,0,.6); overflow:hidden; text-shadow:none; }
    .pp-head{ display:flex; align-items:center; gap:14px; padding:18px 18px 16px; background:linear-gradient(135deg, rgba(59,130,246,0.22), rgba(59,130,246,0.04)); border-bottom:1px solid var(--border); }
    .pp-head .lb-avatar{ width:48px; height:48px; font-size:15px; }
    .pp-who{ flex:1; min-width:0; }
    .pp-who b{ display:block; font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pp-who span{ font-size:12.5px; color:var(--text-faint); }
    .pp-x{ width:36px; height:36px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border); font-size:16px; flex:none; }
    .pp-body{ padding:16px 18px 20px; }
    .pp-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
    .pp-stat{ background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:9px 6px; text-align:center; }
    .pp-stat b{ display:block; font-family:var(--font-display); font-size:20px; font-weight:400; }
    .pp-stat span{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); }
    .pp-h{ font-family:var(--font-head); font-size:13px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent-2); margin:6px 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
    .pp-h small{ font-family:var(--font-body); font-size:11.5px; letter-spacing:0; text-transform:none; color:var(--text-faint); font-weight:500; }
    .pp-stage{ margin-bottom:12px; }
    .pp-stage > div:first-child{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-bottom:6px; }
    .pp-pick{ display:flex; align-items:center; gap:10px; padding:9px 10px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; }
    .pp-pick + .pp-pick{ margin-top:6px; }
    .pp-pick.win{ border-color:rgba(34,197,94,0.45); }
    .pp-pick.loss{ border-color:rgba(239,68,68,0.4); }
    .pp-crest{ width:30px; height:30px; flex:none; object-fit:contain; }
    .pp-crest.none{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:15px; }
    .pp-t{ flex:1; min-width:0; }
    .pp-t b{ display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pp-t span{ font-size:12px; color:var(--text-faint); }
    .pp-res{ flex:none; text-align:right; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .pp-res em{ display:block; font-style:normal; font-size:15px; font-family:var(--font-display); font-weight:400; letter-spacing:0; }
    .pp-res.win{ color:var(--green); } .pp-res.loss{ color:var(--red); } .pp-res.pend{ color:var(--gold); }
    .pp-note{ font-size:12.5px; color:var(--text-faint); background:var(--bg-card); border:1px dashed var(--border); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
    .pp-teams{ display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:7px; }
    .pp-team{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 4px 7px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; text-align:center; position:relative; }
    .pp-team img{ width:30px; height:30px; object-fit:contain; }
    .pp-team span{ font-size:11px; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
    .pp-team.used{ opacity:.38; filter:grayscale(1); }
    .pp-team.used span{ text-decoration:line-through; }
    .pp-team i.tag{ font-style:normal; font-size:9.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.4px; }
    @media (max-width:640px){
      .pp-bg{ padding:0; }
      .pp{ border-radius:0; min-height:100%; border:none; }
      .pp-stats{ grid-template-columns:repeat(2,1fr); }
      .pp-teams{ grid-template-columns:repeat(3,1fr); }
    }
</style>
<script>
/* Profile photo helper for leaderboards. url = uploaded photo (or null),
   text = the initials this page already shows, cls = the circle's class. */
function gbAvatar(url, text, cls){
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ok = typeof url === 'string' && /^https:\/\//i.test(url);
  return '<div class="' + esc(cls || 'gb-av-sm') + ' gb-av">' + esc(text) +
    (ok ? '<img class="gb-av-img" src="' + esc(url) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>';
}
function gbInitials(name){ return String(name || '?').trim().substring(0, 2).toUpperCase(); }
</script>
</head>
<body>

  <div class="bg-glow"></div>

  <main>
    <section class="lb-hero">
      <div class="lb-hero-icon"><i class="fas fa-shield-halved"></i></div>
      <h1>Champions League Leaderboard</h1>
      <p>Every entrant, ranked by total points across the tournament.</p>
      <a href="/champions-league" style="display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:9px 18px; border:1px solid var(--border); border-radius:8px; color:var(--text); text-decoration:none; font-size:13.5px; font-weight:600;"><i class="fas fa-arrow-left"></i> Back to Champions League</a>

  <div class="pp-bg" id="ppBg" role="dialog" aria-modal="true">

  <script>
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const TOURNAMENT_ID = '362c4ac7-ddb7-40b2-8930-8c39a755613c'; // Champions League

    async function loadLeaderboard() {
      const list = document.getElementById('lbList');
      const token = localStorage.getItem('gbf_token');
      if (!token) {
        list.innerHTML = `<div class="empty"><i class="fas fa-lock"></i><a href="/login?redirect=%2Fchampions-league-leaderboard" style="color:var(--accent-2);">Log in</a> to view the leaderboard.</div>`;
        return;
      }
      list.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading leaderboard…</div>';

      try {
        const response = await fetch('/api/tournaments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ action: 'cl_get_leaderboard', tournament_id: TOURNAMENT_ID })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to load leaderboard');

        const entries = data.leaderboard || [];
        if (entries.length === 0) {
          list.innerHTML = '<div class="empty"><i class="fas fa-ranking-star"></i>No entrants yet.</div>';
          return;
        }

        list.innerHTML = entries.map((entry) => {
          const rank = entry.rank;
          const topClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
          const name = entry.display_name || 'Unknown';
          const initials = name.substring(0, 2).toUpperCase();
          const points = (entry.entry_points || 0).toLocaleString();

          return `
            <div class="lb-row tap ${topClass}" data-entry="${escapeHtml(entry.entry_id || '')}" data-rank="${rank}">
              <div class="lb-rank ${topClass}">${rank}</div>
              ${gbAvatar(entry.avatar_url, initials, 'lb-avatar')}
              <div class="lb-name">${escapeHtml(name)}</div>
              <div class="lb-points">${points}<span class="unit">pts</span></div>
            </div>`;
        }).join('');
      } catch (error) {
        console.error('Error loading leaderboard:', error);
        list.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>Couldn\'t load the leaderboard right now.</div>';
      }
    }

    function initAuth() {
      const token = localStorage.getItem('gbf_token');
      const userStr = localStorage.getItem('gbf_user');
      if (token && userStr) {
        try {
          const currentUser = JSON.parse(userStr);
          document.getElementById('navAuthBtn').href = '/profile';
          document.getElementById('navAvatar').innerHTML = `<span style="font-size:13px;font-weight:700;">${escapeHtml((currentUser.display_name || currentUser.username || '?')[0].toUpperCase())}</span>`;
          document.getElementById('navAuthLabel').textContent = currentUser.display_name || currentUser.username || 'Account';
        } catch (e) {}
      }
    }

    function toggleMobileNav(open) {
      document.getElementById('mobileNavDrawer').classList.toggle('open', open);
      document.getElementById('mobileNavOverlay').classList.toggle('open', open);
    }
    document.getElementById('mobileMenuBtn').addEventListener('click', () => toggleMobileNav(true));
    document.getElementById('mobileNavOverlay').addEventListener('click', () => toggleMobileNav(false));

    // ===== Player picks pop-up =====
    const ROUND_LABEL = { r16:'Round of 16', qf:'Quarter-Finals', sf:'Semi-Finals', final:'Final' };
    const ROUND_ORDER = ['r16', 'qf', 'sf', 'final'];
    function stageLabel(p){ return p.matchday ? 'Matchday ' + p.matchday : (ROUND_LABEL[p.round] || p.round || ''); }
    function stageShort(p){ return p.matchday ? 'MD' + p.matchday : ({ r16:'R16', qf:'QF', sf:'SF', final:'Final' }[p.round] || p.round || ''); }
    function stageSort(p){ return p.matchday ? p.matchday : 100 + ROUND_ORDER.indexOf(p.round); }
    function crestImg(url, cls){
      return url ? `<img class="${cls}" src="${escapeHtml(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="${cls} none"><i class="fas fa-shield-halved"></i></span>`;
    }
    function closePicks(){ document.getElementById('ppBg').classList.remove('open'); document.body.style.overflow = ''; }
    async function openPicks(row){
      const entryId = row.dataset.entry; if (!entryId) return;
      const name = row.querySelector('.lb-name').textContent;
      const bg = document.getElementById('ppBg'), body = document.getElementById('ppBody');
      document.getElementById('ppAv').innerHTML = row.querySelector('.lb-avatar') ? row.querySelector('.lb-avatar').outerHTML : '';
      document.getElementById('ppName').textContent = name;
      document.getElementById('ppSub').textContent = 'Rank ' + row.dataset.rank + ' · ' + row.querySelector('.lb-points').textContent.trim();
      body.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading picks…</div>';
      bg.classList.add('open'); bg.scrollTop = 0; document.body.style.overflow = 'hidden';
      try {
        const res = await fetch('/api/tournaments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('gbf_token')}` },
          body: JSON.stringify({ action: 'cl_get_entry_picks', tournament_id: TOURNAMENT_ID, entry_id: entryId })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Failed');
        const picks = (d.picks || []).slice().sort((a, b) => stageSort(a) - stageSort(b) || String(a.kickoff_time).localeCompare(String(b.kickoff_time)));
        const teamById = {}; (d.teams || []).forEach(t => { teamById[t.id] = t; });
        const won = picks.filter(p => p.result === 'win').length, lost = picks.filter(p => p.result === 'loss').length;
        const usedClub = {}; picks.forEach(p => { if (!usedClub[p.club]) usedClub[p.club] = stageShort(p); });
        let html = `<div class="pp-stats">
            <div class="pp-stat"><b>${(d.player.entry_points || 0).toLocaleString()}</b><span>Points</span></div>
            <div class="pp-stat"><b style="color:var(--green)">${won}</b><span>Won</span></div>
            <div class="pp-stat"><b style="color:var(--red)">${lost}</b><span>Lost</span></div>
            <div class="pp-stat"><b>${Object.keys(usedClub).length}<small style="font-family:var(--font-body);font-size:12px;color:var(--text-faint)">/${(d.teams || []).length}</small></b><span>Teams used</span></div>
          </div>`;
        html += `<div class="pp-h">Picks</div>`;
        if (d.hidden_count) html += `<div class="pp-note"><i class="fas fa-lock" style="margin-right:6px"></i>${d.hidden_count > 1 ? d.hidden_count + ' picks' : '1 pick'} for the next matchday ${d.hidden_count > 1 ? 'stay' : 'stays'} hidden until its first game kicks off.</div>`;
        if (!picks.length && !d.hidden_count) html += `<div class="pp-note">No picks yet.</div>`;
        let last = null;
        picks.forEach(p => {
          const lbl = stageLabel(p);
          if (lbl !== last) { if (last !== null) html += '</div>'; html += `<div class="pp-stage"><div>${escapeHtml(lbl)}</div>`; last = lbl; }
          const t = teamById[p.team_id] || {};
          const cls = p.result === 'win' ? 'win' : p.result === 'loss' ? 'loss' : 'pend';
          const resTxt = p.result === 'win' ? 'Won' : p.result === 'loss' ? 'Lost' : (p.status === 'live' ? 'Live' : 'Pending');
          const vs = p.opponent ? `${p.home ? 'vs' : 'at'} ${escapeHtml(p.opponent)}` : '';
          const pred = p.predicted_home_score != null && p.predicted_away_score != null ? ` · predicted ${p.predicted_home_score}-${p.predicted_away_score}` : '';
          const pts = p.result === 'win' || p.result === 'loss' ? `<em>${p.points_earned > 0 ? '+' : ''}${p.points_earned || 0}</em>` : (p.score ? `<em>${escapeHtml(p.score)}</em>` : '');
          html += `<div class="pp-pick ${cls === 'pend' ? '' : cls}">
              ${crestImg(t.crest_url, 'pp-crest')}
              <div class="pp-t"><b>${escapeHtml(t.name || 'Unknown team')}${p.is_auto_pick ? ' <small style="color:var(--text-faint);font-weight:600">(auto)</small>' : ''}</b><span>${vs}${p.score && (p.result === 'win' || p.result === 'loss') ? ' · ' + escapeHtml(p.score) : ''}${pred}</span></div>
              <div class="pp-res ${cls}">${pts}${resTxt}</div>
            </div>`;
        });
        if (last !== null) html += '</div>';
        const teams = (d.teams || []).slice().sort((a, b) => (!!usedClub[b.club] - !!usedClub[a.club]) || a.name.localeCompare(b.name));
        html += `<div class="pp-h" style="margin-top:18px">Teams <small>Greyed out = already used</small></div><div class="pp-teams">` +
          teams.map(t => `<div class="pp-team${usedClub[t.club] ? ' used' : ''}">${crestImg(t.crest_url, '')}<span>${escapeHtml(t.name.replace(/\s+(FC|CF|AC|SC)$/, ''))}</span>${usedClub[t.club] ? `<i class="tag">${escapeHtml(usedClub[t.club])}</i>` : ''}</div>`).join('') + '</div>';
        body.innerHTML = html;
      } catch (e) {
        console.error('Player picks:', e);
        body.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>Couldn\'t load this player\'s picks right now.</div>';
      }
    }
    document.getElementById('lbList').addEventListener('click', e => { const row = e.target.closest('.lb-row.tap'); if (row) openPicks(row); });
    document.getElementById('ppX').addEventListener('click', closePicks);
    document.getElementById('ppBg').addEventListener('click', e => { if (e.target.id === 'ppBg') closePicks(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicks(); });

    initAuth();
    loadLeaderboard();
  </script>
  <script src="live-poll.js"></script>
  <script src="forum-pill.js"></script>
</body>
</html>
