<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg:#040812; --bg-panel:#070d1a; --bg-card:#0a101f; --bg-card-2:#0d1526;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .bg-glow{ position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%); pointer-events:none; z-index:0; }

    /* ================= NAVBAR ================= */
    .navbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:15px 32px; background:rgba(4,8,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-left{display:flex;align-items:center;gap:40px;}
    .logo{display:flex;align-items:center;gap:11px;}
    .logo-mark{ width:38px;height:38px;border-radius:10px; background:linear-gradient(150deg,var(--accent-2),var(--accent-dim)); display:flex;align-items:center;justify-content:center; box-shadow:0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
    .logo-text{font-family:var(--font-head); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.5px;}
    .logo-text .sub{color:var(--accent-2); display:block; font-size:11px; letter-spacing:3px; font-weight:600; margin-top:1px;}
    .nav-links{display:flex; gap:30px;}
    .nav-links a{ font-family:var(--font-head); font-size:14px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); padding-bottom:19px; position:relative; transition:color .2s; }
    .nav-links a:hover{color:var(--text);}

    main{ position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:24px 24px 60px; }

    .back-link{ display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); font-family:var(--font-head); font-weight:600; font-size:14px; margin-bottom:20px; transition:color .2s; }
    .back-link:hover{ color:var(--accent-2); }

    .player-header{ display:flex; align-items:center; gap:22px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:26px 30px; margin-bottom:20px; flex-wrap:wrap; }
    .player-photo{ width:90px; height:90px; border-radius:16px; background:var(--bg-card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; }
    .player-photo img{ width:100%; height:100%; object-fit:cover; }
    .player-photo i{ font-size:34px; color:var(--text-faint); }
    .player-info h1{ font-family:var(--font-display); font-size:28px; letter-spacing:.4px; margin-bottom:4px; }
    .player-info .meta{ display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:14px; flex-wrap:wrap; }
    .pos-pill{ padding:3px 10px; border-radius:20px; font-family:var(--font-head); font-weight:700; font-size:11.5px; letter-spacing:.4px; }
    .pos-pill.gk{background:rgba(242,185,61,0.2);color:var(--gold);}
    .pos-pill.def{background:rgba(59,130,246,0.2);color:var(--accent-2);}
    .pos-pill.mid{background:rgba(34,197,94,0.2);color:var(--green);}
    .pos-pill.fwd{background:rgba(239,68,68,0.2);color:var(--red);}
    .news-banner{ margin-top:14px; width:100%; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.35); border-radius:10px; padding:10px 14px; font-size:13.5px; color:#fca5a5; display:flex; align-items:center; gap:8px; }

    .points-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
    .points-card{ flex:1; min-width:150px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; text-align:center; }
    .points-card.highlight{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
    .points-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:6px; font-family:var(--font-head); font-weight:700; }
    .points-card .value{ font-family:var(--font-display); font-size:30px; }
    .points-card.highlight .value{ color:var(--gold); }

    .stats-card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px; }
    .stats-card h3{ font-family:var(--font-head); font-size:16px; font-weight:700; letter-spacing:.3px; margin-bottom:16px; display:flex; align-items:center; gap:9px; }
    .stats-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:12px; }
    .stat-box{ background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
    .stat-box .label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:4px; }
    .stat-box .value{ font-family:var(--font-head); font-size:19px; font-weight:700; }

    @media (max-width:640px){
      .navbar{ padding:12px 16px; }
      .logo-text{ font-size:14px; }
      .logo-text .sub{ font-size:9px; letter-spacing:2px; }
      .nav-links{ gap:16px; }
      .nav-links a{ font-size:12px; padding-bottom:12px; }
      main{ padding:18px 14px 60px; }
    }

    .loading{ text-align:center; padding:60px 20px; color:var(--text-faint); }
    footer{ position:relative; z-index:1; text-align:center; padding:26px; color:var(--text-faint); font-size:13px; border-top:1px solid var(--border); margin-top:20px; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="navbar">
    <div class="nav-left">
      <a href="/" class="logo">
        <div class="logo-mark"><i class="fas fa-trophy" style="color:#fff;font-size:16px;"></i></div>
        <div class="logo-text">GB TOURNAMENTS<span class="sub">COMPETE · PREDICT · WIN</span></div>
      </a>
      <nav class="nav-links">
        <a href="/">GB Hub</a>
        <a href="/fantasy-manager">Fantasy Manager</a>
        <a href="/fantasy-leaderboard">Fantasy Leaderboard</a>
      </nav>
    </div>
  </header>

  <main>
    <a href="/fantasy-manager" class="back-link"><i class="fas fa-arrow-left"></i> Back to Fantasy Manager</a>

    <div id="playerContent">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading player…</div>
    </div>
  </main>

  <footer>&copy; 2026 GB Tournaments. Predict responsibly.</footer>

  <script>
    const POSITION_LABELS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
    const POSITION_CLASS = { 1: 'gk', 2: 'def', 3: 'mid', 4: 'fwd' };
    const STATUS_LABELS = { a: 'Available', d: 'Doubtful', i: 'Injured', s: 'Suspended', n: 'Unavailable', u: 'Unavailable' };

    function fmtCost(n) { return (n / 10).toFixed(1); }
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function statBox(label, value) {
      return `<div class="stat-box"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></div>`;
    }

    async function loadPlayer() {
      const id = new URLSearchParams(window.location.search).get('id');
      const content = document.getElementById('playerContent');
      if (!id) {
        content.innerHTML = '<div class="loading">No player specified.</div>';
        return;
      }

      try {
        const res = await fetch('/api/sync-players?list=true');
        const data = await res.json();
        const player = (data.players || []).find(p => String(p.id) === String(id));
        const teamsById = {};
        (data.teams || []).forEach(t => { teamsById[t.id] = t; });

        if (!player) {
          content.innerHTML = '<div class="loading">Player not found.</div>';
          return;
        }

        const team = teamsById[player.team];
        const posLabel = POSITION_LABELS[player.element_type] || '?';
        const posClass = POSITION_CLASS[player.element_type] || '';
        const photoCode = (player.photo || '').replace(/\.(jpg|png)$/i, '');
        const photoUrl = photoCode ? `https://resources.premierleague.com/premierleague/photos/players/250x250/p${photoCode}.png` : '';

        let html = `
          <div class="player-header">
            <div class="player-photo">
              ${photoUrl ? `<img src="${photoUrl}" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-user\\'></i>'">` : '<i class="fas fa-user"></i>'}
            </div>
            <div class="player-info">
              <h1>${escapeHtml(player.first_name)} ${escapeHtml(player.second_name)}</h1>
              <div class="meta">
                <span class="pos-pill ${posClass}">${posLabel}</span>
                <span>${team ? escapeHtml(team.name) : 'Unknown club'}</span>
                <span>·</span>
                <span>£${fmtCost(player.now_cost)}m</span>
                <span>·</span>
                <span>${STATUS_LABELS[player.status] || player.status || ''}</span>
              </div>
              ${player.news ? `<div class="news-banner"><i class="fas fa-triangle-exclamation"></i> ${escapeHtml(player.news)}</div>` : ''}
            </div>
          </div>

          <div class="points-row">
            <div class="points-card highlight">
              <div class="label">This Gameweek</div>
              <div class="value">${player.event_points ?? 0}</div>
            </div>
            <div class="points-card">
              <div class="label">Season Total</div>
              <div class="value">${player.total_points ?? 0}</div>
            </div>
            <div class="points-card">
              <div class="label">Points / Game</div>
              <div class="value">${player.points_per_game ?? '0.0'}</div>
            </div>
            <div class="points-card">
              <div class="label">Form</div>
              <div class="value">${player.form ?? '0.0'}</div>
            </div>
          </div>

          <div class="stats-card">
            <h3><i class="fas fa-calendar-week"></i> This Gameweek Only</h3>
            <div class="stats-grid" id="gwStatsGrid">
              <div class="loading" style="padding:12px;"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
            </div>
          </div>

          <div class="stats-card">
            <h3><i class="fas fa-chart-simple"></i> Match Stats (Season)</h3>
            <div class="stats-grid">
              ${statBox('Minutes', player.minutes ?? 0)}
              ${statBox('Goals', player.goals_scored ?? 0)}
              ${statBox('Assists', player.assists ?? 0)}
              ${statBox('Clean Sheets', player.clean_sheets ?? 0)}
              ${statBox('Goals Conceded', player.goals_conceded ?? 0)}
              ${statBox('Own Goals', player.own_goals ?? 0)}
              ${statBox('Penalties Saved', player.penalties_saved ?? 0)}
              ${statBox('Penalties Missed', player.penalties_missed ?? 0)}
              ${statBox('Saves', player.saves ?? 0)}
              ${statBox('Yellow Cards', player.yellow_cards ?? 0)}
              ${statBox('Red Cards', player.red_cards ?? 0)}
              ${statBox('Bonus', player.bonus ?? 0)}
              ${statBox('BPS', player.bps ?? 0)}
            </div>
          </div>

          <div class="stats-card">
            <h3><i class="fas fa-magnifying-glass-chart"></i> Underlying Numbers</h3>
            <div class="stats-grid">
              ${statBox('Influence', player.influence ?? '0.0')}
              ${statBox('Creativity', player.creativity ?? '0.0')}
              ${statBox('Threat', player.threat ?? '0.0')}
              ${statBox('ICT Index', player.ict_index ?? '0.0')}
            </div>
          </div>
        `;

        content.innerHTML = html;
        loadGameweekStats(id);
      } catch (e) {
        console.error('Failed to load player:', e);
        content.innerHTML = '<div class="loading">Couldn\'t load this player right now.</div>';
      }
    }

    async function loadGameweekStats(id) {
      const grid = document.getElementById('gwStatsGrid');
      if (!grid) return;
      try {
        const res = await fetch(`/api/sync-players?summary=${id}`);
        const data = await res.json();
        if (!data.stats) {
          grid.innerHTML = '<div class="loading" style="padding:12px;">No gameweek data yet.</div>';
          return;
        }
        const s = data.stats;
        grid.innerHTML = [
          statBox('Goals', s.goals_scored ?? 0),
          statBox('Assists', s.assists ?? 0),
          statBox('Yellow Cards', s.yellow_cards ?? 0),
          statBox('Red Cards', s.red_cards ?? 0),
          statBox('Minutes', s.minutes ?? 0),
          statBox('Bonus', s.bonus ?? 0)
        ].join('');
      } catch (e) {
        console.error('Failed to load gameweek stats:', e);
        grid.innerHTML = '<div class="loading" style="padding:12px;">Couldn\'t load this week\'s stats.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadPlayer);
  </script>
</body>
</html>
