<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/gb-domain.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - GB Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg:#060b1e; --bg-panel:#0a1226; --bg-card:#0d1730; --bg-card-2:#101a38;
      --border:#131f35; --border-hover:#3b82f6;
      --accent:#3b82f6; --accent-2:#60a5fa; --accent-glow:rgba(59,130,246,0.45); --accent-dim:#1d4ed8;
      --text:#f1f5fc; --text-dim:#8a97b0; --text-faint:#4d5972;
      --gold:#f2b93d; --red:#ef4444; --green:#22c55e;
      --radius:14px;
      --font-display:'Anton','Rajdhani',sans-serif; --font-head:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif;
    }
    *{margin:0; padding:0; box-sizing:border-box;}
    html{ overflow-x:hidden; }
    body{
      background:var(--bg); color:var(--text); font-family:var(--font-body);
      -webkit-font-smoothing:antialiased; min-height:100vh; position:relative;
    }
    a{color:inherit; text-decoration:none;}
    .bg-glow{
      position:fixed; top:-260px; left:50%; width:1300px; height:820px; transform:translateX(-50%);
      background:radial-gradient(ellipse at center, rgba(59,130,246,0.14) 0%, rgba(59,130,246,0) 62%);
      pointer-events:none; z-index:0;
    }
    header{
      position:relative; z-index:2; display:flex; align-items:center; padding:20px 32px;
    }
    .logo{display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:700; font-size:19px; letter-spacing:.3px;}
    .logo-badge{
      width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, var(--accent), var(--accent-dim)); font-size:16px;
    }
    main{
      position:relative; z-index:1; max-width:1080px; margin:20px auto 60px; padding:0 24px;
      display:grid; grid-template-columns:1.2fr 1fr; gap:24px; align-items:start;
    }
    @media (max-width:860px){ main{grid-template-columns:1fr;} }
    @media (max-width:640px){ .form-input{ font-size:16px; } }

    .auth-card{
      background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:36px 40px; transition:border-color .25s;
    }
    .auth-icon{
      width:64px; height:64px; border-radius:16px; margin:0 auto 18px;
      background:linear-gradient(135deg, var(--accent), var(--accent-dim));
      display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff;
    }
    .auth-card h1{
      font-family:var(--font-display); font-size:28px; text-align:center; letter-spacing:.5px; margin-bottom:6px;
    }
    .auth-card .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:28px; }

    .form-group{ margin-bottom:18px; }
    .form-label{
      display:flex; align-items:center; gap:7px; font-family:var(--font-head); font-weight:600; font-size:13px;
      letter-spacing:.3px; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;
    }
    .form-input{
      width:100%; background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
      padding:12px 14px; color:var(--text); font-family:var(--font-body); font-size:14.5px; transition:border-color .2s;
    }
    .form-input::placeholder{ color:var(--text-faint); }
    .form-input:focus{ outline:none; border-color:var(--border-hover); }

    .row-between{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; font-size:13.5px; }
    .checkbox-line{ display:flex; align-items:center; gap:8px; color:var(--text-dim); cursor:pointer; }
    .link-accent{ color:var(--accent-2); }
    #forgot-form[hidden], #login-form[hidden]{ display:none; }
    .fp-intro{ color:var(--text-dim); font-size:14px; line-height:1.5; margin:0 0 16px; }
    .fp-msg{ margin-top:14px; font-size:14px; line-height:1.5; }
    .fp-msg.ok{ color:#86efac; } .fp-msg.err{ color:#fca5a5; }
    .fp-back{ display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-size:14px; }
    .link-accent:hover{ text-decoration:underline; }

    .btn-primary{
      width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
      background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:#fff; border:none;
      border-radius:10px; padding:14px; font-family:var(--font-head); font-weight:700; font-size:15.5px;
      letter-spacing:.3px; cursor:pointer; transition:filter .2s, transform .2s;
    }
    .btn-primary:hover{ filter:brightness(1.1); transform:translateY(-1px); }

    .switch-line{ text-align:center; margin-top:22px; font-size:14px; color:var(--text-dim); }

    .side-card{
      background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px;
    }
    .side-card.highlight{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .side-card h3{
      font-family:var(--font-head); font-size:16px; font-weight:700; letter-spacing:.3px; margin-bottom:14px;
      display:flex; align-items:center; gap:9px;
    }
    .side-card ul{ list-style:none; }
    .side-card li{
      display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px; color:var(--text-dim);
    }
    .side-card li i{ color:var(--accent-2); width:16px; text-align:center; }
    .side-card p{ font-size:13.5px; color:var(--text-dim); line-height:1.5; }
    .btn-outline{
      display:inline-flex; align-items:center; gap:8px; margin-top:12px; padding:9px 16px;
      border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13.5px; font-family:var(--font-head); font-weight:600;
      transition:border-color .2s;
    }
    .btn-outline:hover{ border-color:var(--border-hover); }

    footer{ position:relative; z-index:1; text-align:center; padding:20px; color:var(--text-faint); font-size:13px; }
      /* ===== Default background (assets/card-bg-sports.jpg) on the page and the main card ===== */
    body{
      background:
        linear-gradient(180deg, rgba(4,8,22,0.80) 0%, rgba(4,8,22,0.88) 55%, rgba(4,8,22,0.96) 100%),
        url('assets/card-bg-sports.jpg') center top / cover no-repeat fixed,
        var(--bg);
    }
    @media (max-width:860px){
      /* phones ignore "fixed" backgrounds - let it scroll with the page instead */
      body{ background-attachment:scroll, scroll, scroll; background-size:auto, auto 100vh, auto; background-position:0 0, center top, 0 0; }
    }
    .auth-card{
      position:relative; overflow:hidden; border-color:rgba(96,165,250,0.35);
      background:
        linear-gradient(180deg, rgba(8,14,34,0.72) 0%, rgba(8,14,34,0.90) 45%, rgba(8,14,34,0.96) 100%),
        url('assets/card-bg-sports.jpg') center / cover no-repeat;
      box-shadow:0 20px 50px rgba(0,0,0,0.45);
    }
    .side-card{ background:rgba(10,18,38,0.82); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }

  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header>
    <a href="/" class="logo">
      <div class="logo-badge"><i class="fas fa-trophy"></i></div>
      GB TOURNAMENTS
    </a>
  </header>

  <main style="grid-template-columns:minmax(0,480px); justify-content:center;">
    <div class="auth-card">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h1>Choose a New Password</h1>
      <p class="sub" id="rp-sub">Pick a new password for your GB Tournaments account</p>

      <form id="rp-form" hidden>
        <div class="form-group">
          <label for="rp-pass" class="form-label"><i class="fas fa-lock"></i> New Password</label>
          <input type="password" id="rp-pass" class="form-input" placeholder="At least 8 characters, with a number" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="rp-pass2" class="form-label"><i class="fas fa-lock"></i> Confirm New Password</label>
          <input type="password" id="rp-pass2" class="form-input" placeholder="Type it again" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary" id="rp-btn"><i class="fas fa-check"></i> Save new password</button>
      </form>
      <div class="rp-msg" id="rp-msg"></div>
      <div class="switch-line"><a href="/login" class="link-accent"><i class="fas fa-arrow-left"></i> Back to sign in</a></div>
    </div>
  </main>
  <style>
    #rp-form[hidden]{ display:none; }
    .rp-msg{ margin-top:14px; font-size:14px; line-height:1.55; text-align:center; }
    .rp-msg.ok{ color:#86efac; } .rp-msg.err{ color:#fca5a5; }
  </style>
  <script>
    (function () {
      // The emailed link lands here with the recovery details after the "#"
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      const q = new URLSearchParams(location.search);
      const access = h.get('access_token'), refresh = h.get('refresh_token');
      const err = h.get('error_description') || q.get('error_description');
      // keep the details out of the address bar / history
      if (location.hash) history.replaceState(null, '', location.pathname);
      const form = document.getElementById('rp-form'), msg = document.getElementById('rp-msg'), btn = document.getElementById('rp-btn');
      const say = (t, ok) => { msg.className = 'rp-msg ' + (ok ? 'ok' : 'err'); msg.innerHTML = t; };
      if (err || !access || !refresh) {
        say((err ? err.replace(/\+/g, ' ') + '. ' : 'This reset link is not valid or has expired. ')
          + 'Please <a class="link-accent" href="/login">request a new link</a> from the sign-in page, or message the GB Hub admin.');
        return;
      }
      form.hidden = false;
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const p1 = document.getElementById('rp-pass').value, p2 = document.getElementById('rp-pass2').value;
        if (p1.length < 8 || !/[0-9]/.test(p1)) return say('Password must be at least 8 characters and include a number.');
        if (p1 !== p2) return say('The two passwords don\'t match.');
        btn.disabled = true; say('Saving…', true);
        try {
          const r = await fetch('/api/login', { method:'POST', headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ action:'complete_reset', access_token: access, refresh_token: refresh, new_password: p1 }) });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || 'Could not save the new password.');
          // log them straight in
          try {
            localStorage.setItem('gbf_token', d.session.access_token);
            localStorage.setItem('gbf_refresh', d.session.refresh_token);
            if (d.user) localStorage.setItem('gbf_user', JSON.stringify(d.user));
          } catch (_) {}
          form.hidden = true;
          say('<i class="fas fa-circle-check"></i> Password changed — you\'re now signed in. Taking you to GB Hub…', true);
          setTimeout(() => { location.href = '/'; }, 1800);
        } catch (e2) {
          say(e2.message); btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
